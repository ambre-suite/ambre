[package]
name = "ambre-crypto"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Cryptographic primitives for Ambre (AEAD, signatures, hashing, KDF, key derivation)"

[dependencies]
ambre-core = { path = "../ambre-core" }
thiserror = { workspace = true }

# Crypto
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
blake2 = { workspace = true }
argon2 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }

# getrandom 0.2 is pulled in transitively (rand_core, via the RustCrypto
# stack). On wasm32 it needs its "js" backend enabled; declaring it here with
# the feature lets Cargo's feature unification turn it on for the whole graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
# The hex goldens, and the reference that the base32 fingerprint is checked
# against. The fingerprint itself is hand-written: the generic encoder of this
# crate linked 18 KB into the Sync worker.
data-encoding = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "crypto"
harness = false

[lints]
workspace = true
