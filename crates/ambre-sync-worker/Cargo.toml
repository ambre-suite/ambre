[package]
name = "ambre-sync-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sync Worker WASM — E2EE crypto, single WebSocket, HTTP REST, compression"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
standalone = []

[dependencies]
ambre-bus      = { path = "../ambre-bus" }
ambre-core     = { path = "../ambre-core" }
ambre-protocol = { path = "../ambre-protocol" }
# ambre-crypto will be added when the crypto pipeline is wired.
# It pulls in getrandom without the "js" feature (argon2, chacha20poly1305, ed25519-dalek)
# which requires WASM-specific feature resolution not yet resolved.
# ambre-protocol is safe to add now — it has no crypto dependencies.

serde    = { workspace = true }
postcard = { workspace = true }
tracing      = { workspace = true }
tracing-wasm = { workspace = true }

wasm-bindgen             = { workspace = true }
js-sys                   = { workspace = true }
web-sys                  = { workspace = true, features = ["WebSocket", "BinaryType", "CloseEvent"] }
console_error_panic_hook = { workspace = true }
gloo-net                 = { workspace = true, features = ["http", "websocket"] }
