[package]
name = "ambre-sfu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The selective forwarding unit of an Ambre call: forwards sealed chunks it cannot open"

[dependencies]
ambre-core = { path = "../ambre-core" }
# The signalling WebSocket, on a port of its own (`CALL-036`).
axum       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
# Sans-IO WebRTC. The RustCrypto backend alone: the default one links aws-lc-sys
# (`ambre-spec-call-media.md`, `CALL-013`).
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }

[dev-dependencies]
# The load run drives the signalling socket as a browser does (`src/sim/load.rs`).
futures-util      = { workspace = true }
tokio-tungstenite = "0.29"
# The simulation seeds the generator str0m draws from, so a run follows one path. The test
# exports of str0m seed its DTLS as well (`src/sim/net.rs`).
fastrand          = "2.4"
str0m             = { version = "0.25.0", default-features = false, features = ["rust-crypto", "_internal_test_exports"] }

[lints]
workspace = true
