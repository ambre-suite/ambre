[workspace]
resolver = "2"
members = [
    "crates/ambre-core",
    "crates/ambre-crypto",
    "crates/ambre-protocol",
    "crates/ambre-bus",
    "crates/ambre-draw",
    "crates/ambre-sync",
    "crates/ambre-trame",
    "crates/ambre-prose",
    "crates/ambre-toile",
    "crates/ambre-murmure",
    "crates/ambre-app",
    "crates/ambre-logic-worker",
    "crates/ambre-sync-worker",
]

[workspace.dependencies]
# Common
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_bytes = "0.11"
hex = "0.4"
uuid = { version = "1.0", features = ["v7", "js"] }
postcard = { version = "1.0", features = ["alloc"] }
thiserror = "2.0"
log = "0.4"
cfg-if = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
async-trait = "0.1"

# Crypto
chacha20poly1305 = { version = "0.10" }
ed25519-dalek = { version = "2.0" }
x25519-dalek = { version = "2.0" }
blake2 = { version = "0.10" }
argon2 = { version = "0.5" }

# UI
wgpu = "28.0"
vello = "0.8"
parley = "0.7"
masonry = { git = "https://github.com/linebender/xilem", rev = "05db616" }
kurbo = "0.13"
peniko = "0.6"
winit = "0.30"

# WASM
gloo-net = { version = "0.7", features = ["http", "websocket"] }
web-sys = { version = "0.3.85", features = [
    "DedicatedWorkerGlobalScope",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "Performance",
    "WebSocket",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
js-sys = "0.3.85"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

# Compression
ruzstd = "0.8"

# CRDT
loro = "1.10"

# Graph
petgraph = "0.8"
rstar = "0.12"

# Import/export
docx-rs = "0.4"
krilla = "0.7"
html5ever = "0.39"
pulldown-cmark = "0.13"

# Server
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls"] }
rustis = "0.19.3"
aws-sdk-s3 = "1.128"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package.ambre-app]
opt-level = "z" # size optimizations for WASM binaries

[profile.release.package.ambre-logic-worker]
opt-level = "z"

[profile.release.package.ambre-sync-worker]
opt-level = "z"
