# Ambre release -- the client digest of a tagged commit, published (`ZK-039`).
#
# A push of a tag `v*` builds the client twice from clean trees, compares the
# two manifests, and publishes a GitHub release of the tag. The release
# carries the manifest and the client digest (`scripts/client_digest.py`). A
# user or an auditor then rebuilds the commit with `just reproducible`, or
# checks the files a deployment serves with
# `b2sum -l 256 -c ambre-client.manifest`.
#
# No release is published when the two builds differ: the job fails first.
#
# The same push publishes the images of the relay, the SFU, the client and the
# preparation of the object store to the container registry of the repository,
# then the chart of `deploy/chart/` with the digest of each image pinned in it
# (`SRV-308`, `scripts/chart.py`). A deployment pulls each image by its digest,
# so an auditor matches a running image to the commit of its tag.
#
# Each image job attests the digest it pushed, signed through the OIDC token of
# that job alone, and pushes the attestation beside the image (`SRV-354`,
# `SRV-355`). The chart test verifies each attestation against the commit and
# this workflow before it pulls the image, and the chart waits for it
# (`SRV-356`, `scripts/image_provenance.py`).

name: Release

on:
  push:
    tags: ['v*']

# The default token of every job reads the repository. The one job that
# publishes widens it to write the release, and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    # The public link key of the relay this release serves, a repository
    # variable and no secret: the seed stays with the deployment (`ZK-057`).
    env:
      AMBRE_THREAD_LINK_KEY: ${{ vars.THREAD_LINK_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev brotli
      # The trunk of `TRUNK_VERSION` in `scripts/client_digest.py`, which a
      # script test holds: another trunk writes another page.
      - name: Install just and trunk
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,trunk@0.22.1
      # A release pins a link key, and never the development one (`ZK-057`).
      - run: python3 scripts/link_key.py check
      - run: just reproducible
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          digest=$(cat target/client-digest/ambre-client.digest)
          printf 'Client digest (BLAKE2b-256 of the manifest): `%s`\n\nRebuild: `AMBRE_THREAD_LINK_KEY=%s just reproducible %s`. Check a deployment: `b2sum -l 256 -c ambre-client.manifest` in a copy of the files it serves.\n' "$digest" "$AMBRE_THREAD_LINK_KEY" "$TAG" > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            target/client-digest/ambre-client.manifest target/client-digest/ambre-client.digest

  # The images of the release, one job per target of `deploy/Dockerfile`. The
  # client is a release build: no sign-in by bare name (`ZK-045`), no embed
  # site and no issuer of its own, since a published image serves any host.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [relay, sfu, web, init]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          # The client pins the link key the client digest pins (`ZK-057`).
          build-args: AMBRE_THREAD_LINK_KEY=${{ vars.THREAD_LINK_KEY }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ github.ref_name }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.target }}"
      # The signed provenance of the digest above: the commit, the ref and this
      # workflow, pushed to the registry beside the image (`SRV-354`).
      - name: Attest the provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}
          path: digests/${{ matrix.target }}

  # The chart of the release, with the digest of each image written in. It
  # waits for the release the client job publishes, and adds the list of the
  # images to it.
  chart:
    needs: [client-digest, images, chart-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Pin, check and push the chart
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGES: ghcr.io/${{ github.repository }}
        run: |
          version="${TAG#v}"
          python3 scripts/chart.py pin "$version" \
            relay="$(cat digests/relay)" sfu="$(cat digests/sfu)" \
            web="$(cat digests/web)" init="$(cat digests/init)"
          python3 scripts/chart.py check --release
          for t in relay sfu web init; do printf '%s/%s@%s\n' "$IMAGES" "$t" "$(cat "digests/$t")"; done > ambre-images.txt
          helm package deploy/chart/ambre --destination target/chart
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "target/chart/ambre-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          gh release upload "$TAG" ambre-images.txt "target/chart/ambre-$version.tgz"

  # The chart test of the release, on a cluster of its own. It verifies the
  # provenance of each image by its digest, against the commit and this
  # workflow, before it pulls one (`SRV-356`, `just chart-test-release`). A
  # failed verification fails the job, and the chart is then never pushed.
  chart-test:
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      # The runner image ships gh, kind, kubectl and Helm. The verification
      # reads the attestation from the registry, so it signs in first.
      - name: Verify, pull and install the images of the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ghcr.io/${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in relay sfu web init; do printf '%s/%s@%s\n' "$IMAGES" "$t" "$(cat "digests/$t")"; done > ambre-images.txt
          just chart-test-release ambre-images.txt "$GITHUB_REF" "$GITHUB_SHA"
