[package]
name = "ambre-protocol"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Wire protocol types for Ambre client-server communication"

[dependencies]
ambre-core = { path = "../ambre-core" }
serde = { workspace = true, features = ["derive"] }
postcard = { workspace = true }
# The text form of a call admission (`signaling.rs`).
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
blake2 = { workspace = true }
# The JSON of the messages of the socket of the SFU (`signaling.rs`).
serde_json = { workspace = true }

[lints]
workspace = true
