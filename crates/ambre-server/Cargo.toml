[package]
name = "ambre-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Blind Relay server for Ambre - Axum, PostgreSQL, Valkey, S3"

[features]
test-helpers = []

[dependencies]
ambre-core     = { path = "../ambre-core" }
ambre-protocol = { path = "../ambre-protocol" }
serde             = { workspace = true }
serde_json        = { workspace = true }
serde_bytes       = { workspace = true }
postcard          = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait       = { workspace = true }
tokio             = { workspace = true }
axum              = { workspace = true }
axum-extra        = { workspace = true }
tower             = { workspace = true }
tower-http        = { workspace = true }
futures-util      = { workspace = true }
sqlx              = { workspace = true }
rustis            = { workspace = true }
aws-sdk-s3        = { workspace = true }
ed25519-dalek     = { workspace = true }
chrono            = { workspace = true }
base64            = { workspace = true }
hex               = { workspace = true }
uuid              = { workspace = true, features = ["v4", "v7"] }
time              = { workspace = true }
openidconnect     = { workspace = true }
reqwest           = { workspace = true }
url               = { workspace = true }
sharks            = { workspace = true }
x25519-dalek      = { workspace = true }
chacha20poly1305  = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
goose = "0.18"
