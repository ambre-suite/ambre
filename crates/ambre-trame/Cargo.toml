[package]
name = "ambre-trame"
version = "0.1.0"
edition = "2024"
description = "Trame (spreadsheet) application -- IPC types, logic controller, and UI renderer"

[dependencies]
tracing  = { workspace = true }

# Logic side (Logic thread): TrameState, CRDT / formula engine.
ambre-bus = { path = "../ambre-bus" }
loro      = { workspace = true }
petgraph  = { workspace = true }
nom       = { workspace = true }
# CSV import/export (Trame interop MVP, `ambre-spec-trame-interop.md` §4).
csv       = { workspace = true }
# One atomic per-cell style record (`cellstyle_{sheet}`): serde-derived
# `CellStyle` postcard-encoded into a single CRDT binary register, so concurrent
# whole-cell restyles race once instead of once per style container.
serde     = { workspace = true }
postcard  = { workspace = true }

# UI side (UI Thread): DrawSurface renderer, text layout, frame channels.
ambre-draw = { path = "../ambre-draw" }
# 2D path parsing/flattening: scanline-fill the MdiFilter glyph on the canvas
# autofilter buttons (the GPU surface has no fill_path). Host + wasm.
kurbo      = { workspace = true }
ambre-canvas   = { path = "../ambre-canvas" }
# UI Thread <-> Logic frame channels (shared memory, Main instance).
flume      = { workspace = true }
web-sys    = { workspace = true }
wasm-bindgen = { workspace = true }

# Trame-specific chrome (the `chrome` module): the format toolbar, selection
# toolbar, command wiring. Wasm-only -- leptos CSR + DOM, like ambre-chrome --
# so it is scoped to the wasm32 target and never compiled into host logic tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ambre-chrome = { path = "../ambre-chrome" }
leptos       = { workspace = true }
# Tree-shaken SVG icons for the borders popover (BsBorder* set).
leptos_icons = { workspace = true }
icondata     = { workspace = true }
# Current wall-clock time for TODAY()/NOW() (std::time is unavailable on
# wasm32-unknown-unknown).
js-sys       = { workspace = true }

[dev-dependencies]
# Headless render tests: RecordingSurface mock DrawSurface + FixedClock.
ambre-draw = { path = "../ambre-draw", features = ["testing"] }

# `proptest` pulls `wait-timeout`, which does not compile on
# `wasm32-unknown-unknown`; gating it to the host target keeps the wasm tier
# (`just test-wasm`, the chrome tests below) building. The CRDT convergence
# property tests that use it are host-only anyway (Epic `ET`,
# `ambre-spec-trame-logic.md` §14).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }

# Leptos UI tests (Epic `ET`, `ambre-spec-trame-ui.md` sec.14/18): the chrome is
# `cfg(target_arch = "wasm32")` (leptos CSR + DOM), so its tests run under the
# wasm target via `wasm-pack test --headless --chrome` (`just test-wasm`). These
# dev-deps let the integration test name the chrome's public types directly
# (ambre-bus events, the leptos signals, ambre-chrome stores, the perf snapshot).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
leptos       = { workspace = true }
ambre-bus    = { path = "../ambre-bus" }
ambre-chrome = { path = "../ambre-chrome" }
ambre-canvas = { path = "../ambre-canvas" }
