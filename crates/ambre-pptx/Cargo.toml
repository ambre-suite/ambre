[package]
name = "ambre-pptx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The PowerPoint codec: a deck model, its writer to a PresentationML package and its reader back (3-Toile/features/ambre-spec-toile-pptx-export.md, ambre-spec-toile-pptx-import.md)"

[features]
# The writer, the reader and the package layer. Without it the crate is the
# deck model and its report alone: the shapes the Logic thread fills and
# reads and the converter module answers, so the Main instance links no zip
# and no XML parser.
codec = ["dep:ambre-client-core", "dep:ambre-opc", "dep:quick-xml"]

[dependencies]
ambre-core = { path = "../ambre-core" }
ambre-client-core = { path = "../ambre-client-core", optional = true }
serde      = { workspace = true }
thiserror  = { workspace = true }

# The package layer the DOCX, xlsx and PPTX codecs share.
ambre-opc = { path = "../ambre-opc", optional = true }
quick-xml = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
