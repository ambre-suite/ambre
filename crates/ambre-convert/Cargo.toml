[package]
name = "ambre-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The converter modules: file formats in and out, one wasm instance per format family, fetched by the Logic thread on the first conversion of that family"

[lib]
# cdylib: a converter module, one wasm artifact per family, built apart from
# the Main instance by `scripts/converter_build.py` and fetched on the first
# conversion of its family. rlib: the Logic thread and the applications link
# the request types on every target, and the engines themselves on the host.
crate-type = ["cdylib", "rlib"]

[features]
# One feature per format family (`ambre_core::ConverterFamily`). A module
# build turns one on, the host turns every one on, and the Main instance none:
# it links the request types and the loader alone (`ARCH-078`).
tables = ["engine", "dep:csv"]
pdf = ["engine", "dep:ambre-pdf"]
markup = ["engine", "dep:pulldown-cmark", "dep:html5ever"]
images = ["engine", "dep:usvg", "dep:roxmltree", "dep:image-webp"]
office = ["engine", "dep:ambre-docx", "ambre-docx/codec", "ambre-prose-form/word", "ambre-xlsx/codec", "ambre-pptx/codec"]
# Every family, linked in place: the host tier and the tests.
all-families = ["tables", "pdf", "markup", "images", "office"]
# Set by each family: this build carries an engine and its exports.
engine = []
# The loader that instantiates the fetched module, on wasm. On in the Main
# instance alone: the module build leaves it off, so the module links no
# JavaScript binding it would export.
loader = ["dep:js-sys"]

[dependencies]
ambre-core = { path = "../ambre-core" }
# The recorded draw list a PDF request carries (`ambre_draw::list`).
ambre-draw = { path = "../ambre-draw" }
# The role of Prose's intermediate form, which a DOCX request and its answer
# carry as bytes, in every build. The `office` family turns on the Word mapping
# over the form, in its module alone (`4-Prose/features/ambre-spec-prose-
# import-export.md section 3`).
ambre-prose-form = { path = "../ambre-prose-form" }
# The Excel model and its report, which an xlsx request and its answer
# carry as bytes, in every build. The `office` family turns on the codec, in
# its module alone (`2-Trame/features/ambre-spec-trame-import-export.md
# section 3`).
ambre-xlsx = { path = "../ambre-xlsx", default-features = false }
# The PowerPoint deck model, which a PPTX request carries, in every build.
# The `office` family turns on the writer, in its module alone
# (`3-Toile/features/ambre-spec-toile-pptx-export.md section 3`).
ambre-pptx = { path = "../ambre-pptx" }
# office: the Word codec, with the package layer and its XML work.
ambre-docx = { path = "../ambre-docx", optional = true }
serde      = { workspace = true }
# A request and its answer cross into the module as postcard bytes.
postcard   = { workspace = true }
thiserror  = { workspace = true }

# The engines, each behind its family. Pure Rust.
# tables: the CSV reader and writer.
csv        = { workspace = true, optional = true }
# pdf: the PDF writer.
ambre-pdf  = { path = "../ambre-pdf", optional = true }
# markup: the Markdown parser, and the WHATWG tree builder of an HTML paste
# (`features/ambre-spec-prose-clipboard.md`).
pulldown-cmark = { workspace = true, optional = true }
html5ever  = { workspace = true, optional = true }
# images: the SVG reader, and the XML parser of its text pass. usvg drops its
# font stack (workspace manifest), so its tree carries no text.
usvg       = { workspace = true, optional = true }
roxmltree  = { workspace = true, optional = true }
# images: the WebP decoder, pure Rust (`image-webp`), the one the `image`
# crate's `webp` feature wraps. Called directly, without the 98 KB of brotli
# the `image` crate adds around it. Main's own `image` line keeps PNG and JPEG
# alone: a WebP picture reaches a board through this module.
image-webp = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The module's exports, and the loader the Logic thread instantiates it with.
wasm-bindgen = { workspace = true }
js-sys       = { workspace = true, optional = true }

# The loader's tests run in the browser (`just test-wasm`).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
