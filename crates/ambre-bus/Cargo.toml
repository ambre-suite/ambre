[package]
name = "ambre-bus"
version = "0.1.0"
edition = "2024"
description = "IPC message types for inter-thread communication in Ambre"

[dependencies]
ambre-core = { path = "../ambre-core" }
# Serde derives on the Logic <-> Sync envelope (`SyncCommand` / `LogicEvent` and
# their `Rest*` payloads): that link now crosses a `postMessage` boundary between
# the Main instance and the separate Sync worker, so it is postcard-serialized.
serde = { workspace = true }

[dev-dependencies]
# Used only by the host tests to round-trip the Logic <-> Sync envelopes through
# the same codec (postcard) they cross the `postMessage` hop with. Not a runtime
# dependency: the encode/decode itself lives in `ambre-app` / `ambre-sync`.
postcard = { workspace = true }
