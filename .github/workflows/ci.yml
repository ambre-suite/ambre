  # test-db -- RE-ENABLE WITH ET story "feature `db` on ambre-server". Until the
  # `db` Cargo feature exists and gates the ~20 server tests, `just test-db`
  # fails to compile (unknown feature). Server integration behind the `db`
  # feature against real postgres / redis / minio service containers;
  # `#[sqlx::test]` provisions an ephemeral database per test off DATABASE_URL.
  #
  # Image tags below are kept in sync with `docker-compose.yml` (the dev source
  # of truth) so a test never passes on one Postgres/Redis and fails on another.
  # Exception: minio. The compose uses the official `minio/minio` image, which
  # requires `command: server /data` -- GA `services:` cannot override a
  # container command, so CI uses `bitnami/minio` (env-configurable, auto-creates
  # the bucket via MINIO_DEFAULT_BUCKETS). Same server, different entrypoint.
