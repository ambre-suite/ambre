[package]
name = "ambre-pdf"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "KrillaSurface: DrawSurface implementation for PDF export (the converter module, fetched on demand)"

[dependencies]
ambre-core = { path = "../ambre-core" }
ambre-client-core = { path = "../ambre-client-core" }
ambre-draw = { path = "../ambre-draw" }
thiserror = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
# default-features off: we skip the simple-text draw_text helper and rayon to
# keep the lazy-loaded PDF chunk small on wasm. `raster-images` is enabled so
# `KrillaSurface::draw_image` can embed Toile media (`toile-pdf-export`,
# `toile-media`).
krilla = { workspace = true, features = ["raster-images"] }

[dev-dependencies]
# The tests shape real text on the shipped faces, then read the characters
# back out of the written file with an independent extractor (`PDF-005`).
# `pdf-extract` is pure Rust over lopdf, and MIT.
ambre-draw = { path = "../ambre-draw", features = ["testing"] }
parley = { workspace = true }
pdf-extract = "0.12"
# Reads the annotations and the catalog of a written file back
# (`ambre-spec-pdf-export.md section 3`). Already in the graph through `pdf-extract`, with the same
# features, so the line adds no crate.
lopdf = { version = "0.42", default-features = false, features = ["wasm_js"] }

[lints]
workspace = true
