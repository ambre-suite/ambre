[package]
name = "ambre-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI Thread WASM — Vello/Masonry rendering, rAF loop, input capture, Worker bootstrap"

[lib]
crate-type = ["cdylib"]

[features]
# In dev, one WASM binary serves all three roles (UI Thread + Logic + Sync).
# The dispatcher in main() routes to the correct worker start() based on
# DedicatedWorkerGlobalScope::name(). Disable for standalone (split) builds
# where each worker is compiled as its own independent binary.
default = ["unified"]
unified = ["dep:ambre-logic-worker", "dep:ambre-sync-worker"]

[dependencies]
ambre-bus          = { path = "../ambre-bus" }
ambre-core         = { path = "../ambre-core" }
ambre-draw         = { path = "../ambre-draw" }
ambre-trame        = { path = "../ambre-trame" }
ambre-logic-worker = { path = "../ambre-logic-worker", optional = true }
ambre-sync-worker  = { path = "../ambre-sync-worker", optional = true }

serde    = { workspace = true }
postcard = { workspace = true }
log      = { workspace = true }
cfg-if   = { workspace = true }

# UI rendering (Vello, Masonry, wgpu, winit)
vello   = { workspace = true }
masonry = { workspace = true }
wgpu    = { workspace = true }
winit   = { workspace = true }

# Web APIs
web-sys = { workspace = true, features = ["WorkerOptions", "WorkerType"] }
js-sys  = { workspace = true }
wasm-bindgen         = { workspace = true }
wasm-bindgen-futures = { workspace = true }

console_log              = { workspace = true }
console_error_panic_hook = { workspace = true }
