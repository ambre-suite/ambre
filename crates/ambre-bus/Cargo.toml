[package]
name = "ambre-bus"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "IPC message types for inter-thread communication in Ambre"

[dependencies]
ambre-core = { path = "../ambre-core" }
# Serde derives on the Logic <-> Sync envelope (`SyncCommand` / `LogicEvent` and
# their `Rest*` payloads): that link now crosses a `postMessage` boundary between
# the Main instance and the separate Sync worker, so it is postcard-serialized.
serde = { workspace = true }
# 2D geometry carried by the Toile IPC contract (`toile` module): viewport /
# bounds math, connector paths, element transforms.
kurbo = { workspace = true }
# Compact LWW encoding of the Toile per-element `ElementStyle` register (§2.E),
# and the host round-trip of the Logic <-> Sync envelopes below.
postcard = { workspace = true }
# `ToileError` and `ProseError` derive `thiserror::Error`.
thiserror = { workspace = true }
# The queues under the `conduit` channels, every client thread's. They take no
# lock: flume's `std::sync::Mutex`, once contended on the page's main thread,
# ends in `Atomics.wait`, which the browser refuses there (`ARCH-020`).
crossbeam-queue = { workspace = true }
# Wakes the task awaiting `Receiver::recv` without a lock.
atomic-waker = { workspace = true }

[dev-dependencies]
# `Seq::nth` for a test that names a count. Test builds alone, held by
# `ambre-core/tests/testing_feature.rs` (`ARCH-055`).
ambre-core = { path = "../ambre-core", features = ["testing"] }

[lints]
workspace = true
