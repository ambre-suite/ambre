# The TLS front of the self-hosted stack (`deploy/README.md`). A host with one
# address has one port 443, and two services need it: the page, and TURN over
# TCP for a network that opens nothing else (`CALL-042`). The front reads the
# first bytes of each connection and opens none of them:
#
# * a TLS hello that names a server goes to Caddy, which holds the certificate;
# * anything else is TURN, which speaks plain TCP, and goes to coturn.
#
# Each outer connection reaches an inner listener with a PROXY header, so the
# inner listener knows the address of the client. The web listener passes it
# on to Caddy, which hands it to the relay for its rate limits.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    map $ssl_preread_server_name $ambre_inner {
        ""      127.0.0.1:8445;
        default 127.0.0.1:8444;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $ambre_inner;
    }

    # The page: the address of the client goes on to Caddy.
    server {
        listen 127.0.0.1:8444 proxy_protocol;
        set_real_ip_from 127.0.0.1;
        proxy_protocol on;
        proxy_pass 127.0.0.1:8443;
    }

    # TURN over TCP: coturn reads no PROXY header.
    server {
        listen 127.0.0.1:8445 proxy_protocol;
        set_real_ip_from 127.0.0.1;
        proxy_pass 127.0.0.1:3478;
    }
}
