[package]
name = "ambre-prose"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Word processing application for Ambre — rich text, layout, import/export"

[features]
# Document-fixture machinery (`ambre-spec-fixtures.md`, `FIXTURE-007`).
# Non-default and host-only. It forwards `ambre-core/fixtures` explicitly: a
# Cargo feature never enables its dependency's feature implicitly, and the gated
# code names `ambre_core::FixtureShape`.
fixtures = ["ambre-core/fixtures"]
# The import of an arbitrary form, reachable from the fuzz target in `fuzz/`
# (`PROSE-IO-112`). Non-default: no product build links it.
fuzz = []

[dependencies]
ambre-core = { path = "../ambre-core" }
ambre-client-core = { path = "../ambre-client-core" }
ambre-bus = { path = "../ambre-bus" }
# The request types and the loader of the converter modules: the markup
# module parses Markdown and HTML, and Prose maps the trees it answers
# (`ambre-spec-architecture.md section 2`, the converter modules). The Main
# instance links no parser (`ARCH-078`).
ambre-convert = { path = "../ambre-convert" }
# The intermediate form, which the Office module maps a Word package onto and
# back. Prose links the form alone: the Word mapping, the codec, its ZIP and
# its XML work stay in the module (`ambre-spec-budgets.md section 5`).
ambre-prose-form = { path = "../ambre-prose-form" }

# The command registry the shell's palette and keymap read: Prose's table
# declares its entries there, as ambre-toile's and ambre-trame's do. A leaf
# with an empty dependency table (`UI-THREAD-027`).
ambre-commands = { path = "../ambre-commands" }

# Family resolution and script classification, shared with the renderers
# (`CANVAS-017`). Pagination must resolve a label exactly as the UI thread
# does, or two peers break pages differently (`PROSE-108`). ambre-draw is the
# lightest crate that holds it: geometry, colour and text, no graphics stack.
ambre-draw = { path = "../ambre-draw" }
serde = { workspace = true }
tracing = { workspace = true }
# The refusals of the message vocabulary (`message`) derive `thiserror::Error`.
thiserror = { workspace = true }

# CRDT: `LoroMovableTree` for the block hierarchy, `LoroText` for a body,
# `LoroMap` for the registers, `UndoManager` for the local history
# (`features/ambre-spec-prose-engine.md section 3`).
loro = { workspace = true }
# The map handles typed by the schema keys.
ambre-crdt = { path = "../ambre-crdt" }

# The presence sample, and nothing else: a CRDT delta is already bytes
# (`features/ambre-spec-prose-engine.md section 3.D`).
postcard = { workspace = true }

# The typographic layout pagination measures with: line breaking and glyph
# metrics, not just the run types a draw surface exposes
# (`features/ambre-spec-prose-engine.md section 5`). Only parley -- not the
# whole GPU canvas crate -- so the Logic worker's wasm stays lean.
parley = { workspace = true }

# Word and grapheme boundaries for the word count (UAX #29). A character is a
# grapheme cluster and a word is a word segment holding a letter or a digit
# (`features/ambre-spec-prose-word-count.md section 2`), and neither can be
# answered from `char` alone. Already in the graph through `convert_case`, and
# budgeted in `ambre-spec-budgets.md section 5`.
unicode-segmentation = { workspace = true }

# The format guess of a picture an office package names, and the EXIF
# orientation reader of a JPEG. A picture decodes on the converter thread,
# never here (`features/ambre-spec-prose-images.md section 3`). Main already
# links the crate for Toile's pictures, so the line adds no crate.
image = { workspace = true }


# The Prose chrome -- the comment panel and the suggestion popover
# (`PROSE-UI-050`, `PROSE-UI-052`) -- is wasm-only Leptos, as ambre-toile's and
# ambre-trame's chrome are. Scoped to wasm32, so the host tests never build it.
# web-sys gives the reply field its keyboard event.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The shared menu type the page's context menu is built from, so the shell
# only renders Prose's entries (`ARCH-018`).
ambre-chrome = { path = "../ambre-chrome" }
leptos = { workspace = true }
web-sys = { workspace = true }

[dev-dependencies]
# `Seq::nth` for a test that names a count. Test builds alone, held by
# `ambre-core/tests/testing_feature.rs` (`ARCH-055`).
ambre-core = { path = "../ambre-core", features = ["testing"] }

# Placement holds universal rules over an unenumerated input space: a walk that
# terminates, a page it never goes back to, and a cut only ever taken at a line
# (`PROSE-017`, `PROSE-078`, `PROSE-071`). proptest pulls `wait-timeout`, which
# does not build on wasm32, and placement is host-testable, so it is gated to
# the host target as ambre-toile and ambre-trame do.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }
# A Word test assembles its package with the codec, and reads an export back
# through the mapping, as the Office module does.
ambre-docx = { path = "../ambre-docx" }
ambre-prose-form = { path = "../ambre-prose-form", features = ["word"] }
# The markup, PDF, Office and images engines linked in place, as the Logic
# thread's host build links them: the readers' tests convert through the same
# request bytes, the PDF tests write a drawn page and read its characters back
# (`PDF-005`), and a picture decodes as the converter thread decodes it.
ambre-convert = { path = "../ambre-convert", features = ["markup", "pdf", "office", "images", "spell_en", "spell_fr"] }
# The JPEG and GIF fixtures are written by the encoders of the `image` crate
# at test time. Main links no JPEG or GIF decoder (`ARCH-078`).
image = { workspace = true, features = ["jpeg", "gif"] }
# The recording surface: the painter is driven against it and its ordered
# draw calls are asserted on, off any GPU (`PROSE-UI-117`, `PROSE-UI-118`).
# The same crate as the runtime dependency, with its test double switched on.
ambre-draw = { path = "../ambre-draw", features = ["testing"] }
# The HTML paste bench holds the "Prose HTML clipboard import" row of the
# budget registry. Host-only, as the other benches of the workspace are.
criterion = { workspace = true }
# Reads the characters back out of an exported file (`PDF-005`).
pdf-extract = "0.12"
# Reads the pages, the link annotations and the catalog of an exported file
# back (`PROSE-IO-029`, `PROSE-IO-031`, `PROSE-IO-032`). Already in the graph
# through `pdf-extract`, with the same features, so the line adds no crate.
lopdf = { version = "0.42", default-features = false, features = ["wasm_js"] }

# The chrome tests mount the panel in headless Chrome (`tests/chrome_panel.rs`,
# `just test-wasm`), as ambre-trame's do.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "html_paste"
harness = false

# The keystroke bench holds the "Logic pass that answers a keystroke" row.
[[bench]]
name = "keystroke"
harness = false

# Holds the "Text layout" row for a Prose paragraph by a count of instructions
# under callgrind, through `scripts/instructions.py` (`PROSE-UI-215`).
[[bench]]
name = "instructions"
harness = false

[lints]
workspace = true
