[package]
name = "ambre-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Blind Relay server for Ambre - Axum, PostgreSQL, Redis, S3"

[features]
test-helpers = []
# `db` flips the `cfg_attr(not(feature = "db"), ignore = ...)` gate off so the
# server integration tests (postgres / redis / garage) actually run. Requires the
# backing services (`just services-up`); `#[sqlx::test]` provisions an ephemeral
# database per test. Pure marker feature -- it gates test attributes only.
db = []

[dependencies]
ambre-core     = { path = "../ambre-core" }
ambre-protocol = { path = "../ambre-protocol" }
# The metrics, under closed labels alone (`SRV-257`, `ZK-029`).
ambre-metrics  = { path = "../ambre-metrics" }
serde             = { workspace = true }
serde_json        = { workspace = true }
serde_bytes       = { workspace = true }
postcard          = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait       = { workspace = true }
tokio             = { workspace = true }
axum              = { workspace = true }
tower             = { workspace = true }
tower-http        = { workspace = true }
futures-util      = { workspace = true }
sqlx              = { workspace = true }
rustis            = { workspace = true }
aws-sdk-s3        = { workspace = true }
ed25519-dalek     = { workspace = true, features = ["pkcs8"] }
chrono            = { workspace = true }
base64            = { workspace = true }
hex               = { workspace = true }
uuid              = { workspace = true, features = ["v4", "v7"] }
time              = { workspace = true }
getrandom         = { workspace = true }
jsonwebtoken      = { workspace = true }
openidconnect     = { workspace = true }
reqwest           = { workspace = true }
url               = { workspace = true }
# The store keys of a refresh token and of a sign-in state are the SHA-256 of the
# value, so a copy of the ephemeral store holds no token that signs anyone in
# (`ambre-spec-session.md` section 3, `SRV-267`). A hash, no key: it grants the
# relay no capability that `ZK-004` bans. Already in the tree through `ambre-crypto`.
sha2              = { workspace = true }

# Least privilege (ZK-004 / SRV-012, `ambre-spec-zero-knowledge.md`): the server
# verifies Ed25519 signatures and mints its own access tokens -- nothing else.
# `chacha20poly1305`, `x25519-dalek` and `sharks` were declared here without a
# single use in `src/`, which handed the relay process AEAD, key-exchange and
# secret-sharing capability it must not hold. Adding any of them back is a
# zero-knowledge decision, not a build detail: `deny.toml` refuses it.

[dev-dependencies]
goose = "0.18"
# Already in the tree through axum's `ws` feature; drives the upgrade from a test.
tokio-tungstenite = "0.29"
# Already in the tree through `openidconnect`. A test plays the provider and
# signs an identity token with a key it generates; the relay itself holds no
# RSA private key.
rsa = { version = "0.9", features = ["getrandom"] }
# The bound that proves the token signing seed wipes on drop (`SRV-235`). The
# code itself wipes through `ambre_core::Secret` alone (`ARCH-046`).
zeroize = { workspace = true }

[lints]
workspace = true
