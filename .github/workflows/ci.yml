# Ambre CI -- the normative pipeline (architecture spec section 4 "CI").
#
# Each job invokes a `just` recipe so the command lines live in exactly one
# place (the root `justfile`) and `just <recipe>` locally reproduces the job.
# The pinned nightly toolchain (`-Z build-std` for multi-threaded wasm) is
# picked up automatically from `rust-toolchain.toml`.

name: CI

on:
  # Run on every branch push (so CI fires on feature branches before any PR
  # exists) and on pull requests (covers forks, which can't push here).
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes. Keyed by
# event name + ref so a branch push and its PR don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # lint -- host target. fmt + clippy with warnings denied. The wasm
  # `-A warnings` rustflag is scoped to `[target.wasm32-unknown-unknown]`, so
  # host clippy keeps every warning.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the base branch for `schema-freeze`, and each freeze
      # commit for `freeze-provenance`. The tags too: `schema-freeze` reads a
      # release tag to bind the sections, and refuses a shallow clone with none.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      # fontconfig dev headers: the font stack (fontique/parley via
      # ambre-draw/ambre-canvas) links the system fontconfig at build time.
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Toolchain (rustfmt + clippy)
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          # Only the default branch writes caches; feature branches restore
          # from main without consuming the shared 10 GB budget (avoids eviction).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just lint
      # Doc-side check, milliseconds: derives the contract ledger and fails on a
      # status value or a missing Story citation (`ambre-spec-architecture.md §4`).
      - run: just contracts
      # The parsed corpus: one record per row and the edges it asserts, built
      # into the ignored `target/specs/`, plus every edge resolved
      # (`ambre-spec-template.md` §1.D). Git carries neither file.
      - run: just index-write
      # The primitive gate: every bare primitive outside a test is typed or named
      # by the allowlist, and no line names a site that is gone (`ARCH-033`).
      # It first holds the files it reads to the files rustc compiles: it runs
      # the compile lines of `lint` and `lint-wasm` as written, so the host
      # line finds fresh each unit `just lint` built above. It reads their
      # dep-info (`ARCH-033`, `ARCH-045`), and prints that half's count before
      # the allowlist half.
      # Then, on the same scan, the strict unwrap report: no newtype unwrapped
      # early inside a body unless `ambre-unwrap.tsv` names its key with a
      # count and a reason (`ARCH-073`). The step prints both verdicts on its
      # last line, and fails on either.
      - run: just primitives
      # What a spec quotes: no function body in a spec (template §0).
      - run: just spec-code
      # How a spec is built: prose share, production markers in a feature
      # document, the schema budgets, and the container cross-check.
      - run: just spec-shape
      # What the three answers under a contract table spend, and whether any line
      # writes the document's own history rather than what the system is.
      - run: just spec-answers
      # What a spec points at: every document name cited, in the code and in the
      # corpus, names a document that exists (`ambre-spec-template.md` §1.D).
      - run: just spec-refs
      # What the corpus derives: the feature inventory of each application must
      # be what the feature documents say today (`ambre-spec-template.md` §4).
      - run: just inventory
      # A frozen shape section is the record of what one `SCHEMA_VERSION`
      # wrote, so it never moves. The check compares the shape files against
      # the default branch; a push of `main` itself is read against its
      # parent. The checkout fetches the whole history (`fetch-depth: 0`).
      - run: just schema-freeze
      # A frozen artifact is checked at the commit that froze it, which the
      # whole history carries. Only the artifacts `main` lacks are rebuilt.
      - run: just freeze-provenance
      # What each crate can reach: fixture machinery out of the client build,
      # a generator driving commands, a shared control with no whole-style
      # type to emit, and a launcher naming no application's logic.
      - run: just crate-boundaries
      # How the English is written: the mechanical half of
      # `ai/ambre-writing-style.md`, every metric a hard error.
      - run: just prose
      # What the checks above themselves read: a defect in a reader is silent,
      # so each of them proves nothing unless this one is green.
      - run: just test-scripts

  # ---------------------------------------------------------------------------
  # deny -- supply chain (advisories, licences, sources) plus the zero-knowledge
  # capability bans: which crates may link AEAD, Argon2, X25519, Ed25519 and the
  # CRDT engine (`deny.toml`). Re-granting a capability has to be an edit of
  # `deny.toml`, reviewed as such, instead of one line in a `Cargo.toml`.
  # ---------------------------------------------------------------------------
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: just deny

  # ---------------------------------------------------------------------------
  # fuzz -- one minute of libFuzzer on each untrusted reader: the wire decode,
  # the `.ambre` container, the formula parser and the Markdown reader
  # (`ambre-spec-testing.md section 2`). A crash fails the job and uploads the
  # input that caused it.
  # ---------------------------------------------------------------------------
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev
      - name: Install just and cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just fuzz 60
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  # ---------------------------------------------------------------------------
  # instructions -- the budgets held by a count of instructions under
  # callgrind (`ambre-spec-testing.md section 2`). A time on a shared runner
  # moves by tens of percent between runs; a count does not, so an operation
  # over its ceiling fails the build. The ceilings live in the script.
  # ---------------------------------------------------------------------------
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev valgrind
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: instructions
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just instructions

  # ---------------------------------------------------------------------------
  # test-native -- pure Rust on the native x86_64 target (the spec's "host"
  # tier): the whole workspace, the server and the feature-gated belts included,
  # zero external dependency.
  # ---------------------------------------------------------------------------
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The tier is one `cargo test` line over one feature set (see the
      # `test-native` recipe), so it builds the workspace once. It used to run
      # four lines under four sets, each of which cargo caches separately: four
      # copies of the workspace in one `target/`, which overflowed the runner
      # while archiving `libtokio.rlib` with every test up to that point green.
      #
      # The hosted image ships ~30 GB of toolchains no Rust job here touches.
      # Dropping them keeps the margin wide now that the build no longer needs
      # it, and the `df` leaves the real figure in the log so the next squeeze is
      # diagnosable rather than guessed at.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # fontconfig dev headers: the font stack (fontique/parley via
      # ambre-draw/ambre-canvas) links the system fontconfig at build time.
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-native
          # Only the default branch writes caches; feature branches restore
          # from main without consuming the shared 10 GB budget (avoids eviction).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just test-native
      # The fixture corpus regenerated against its committed bytes and
      # manifests, and each frozen artifact against its kept version. A drift
      # is a change of document meaning no test reads, so it fails here and a
      # human accepts the regenerated golden (`ambre-spec-fixtures.md`).
      - run: just fixtures-check

  # ---------------------------------------------------------------------------
  # test-db -- server integration behind the `db` Cargo feature against real
  # postgres / redis service containers; `#[sqlx::test]` provisions an ephemeral
  # database per test off DATABASE_URL. The `db` feature flips the
  # `cfg_attr(not(feature = "db"), ignore = ...)` gate off (see ambre-server).
  #
  # Image tags are kept in sync with `docker-compose.yml` (the dev source of
  # truth) so a test never passes on one Postgres/Redis and fails on another.
  #
  # Garage is started by a step, not declared as a service: a service container
  # starts before the checkout, so it cannot mount `garage.toml`. The media
  # round trip (`SYNC-139`) puts a blob through it and reads it back;
  # `just test-db` points the suite at it through S3_ENDPOINT.
  # ---------------------------------------------------------------------------
  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine   # keep in sync with docker-compose.yml
        env:
          POSTGRES_USER: ambre
          POSTGRES_PASSWORD: ambre
          POSTGRES_DB: ambre_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambre -d ambre_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine     # keep in sync with docker-compose.yml
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ambre:ambre@localhost:5432/ambre_dev
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-db
          # Only the default branch writes caches; feature branches restore
          # from main without consuming the shared 10 GB budget (avoids eviction).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The garage of docker-compose.yml, prepared by `scripts/garage_init.sh`.
      - name: Start garage
        run: just garage-up
      - run: just test-db

  # ---------------------------------------------------------------------------
  # test-browser -- the browser-driven belt (`crates/ambre-belt`): the Trunk
  # build of the whole application, served in front of a relay and driven by
  # headless Chrome through chromedriver, then by headless Firefox through
  # geckodriver. The relay needs the db-tier services.
  # ---------------------------------------------------------------------------
  test-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, firefox]
    services:
      postgres:
        image: postgres:16-alpine   # keep in sync with docker-compose.yml
        env:
          POSTGRES_USER: ambre
          POSTGRES_PASSWORD: ambre
          POSTGRES_DB: ambre_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambre -d ambre_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine     # keep in sync with docker-compose.yml
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ambre:ambre@localhost:5432/ambre_dev
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev
      # The TURN test runs coturn behind a TCP front on port 443, which the runner user may
      # bind once the unprivileged range starts there.
      - name: TURN relay
        run: sudo apt-get install -y coturn && sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      # Headless Firefox makes its WebGL2 context through an X display and the
      # Mesa EGL driver: `xvfb-run` gives it the display.
      - name: System deps (Firefox)
        if: matrix.engine == 'firefox'
        run: sudo apt-get install -y xvfb libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Install just and trunk
        uses: taiki-e/install-action@v2
        with:
          tool: just,trunk
      - name: Install Chrome and chromedriver
        if: matrix.engine == 'chrome'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true
      - name: Install Firefox
        if: matrix.engine == 'firefox'
        id: firefox
        uses: browser-actions/setup-firefox@v1
      - name: Install geckodriver
        if: matrix.engine == 'firefox'
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-browser
          # Only the default branch writes caches; feature branches restore
          # from main without consuming the shared 10 GB budget (avoids eviction).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The garage of docker-compose.yml, prepared by `scripts/garage_init.sh`.
      # The relay stores media in the bucket, and creates none.
      - name: Start garage
        run: just garage-up
      - run: just test-browser
        if: matrix.engine == 'chrome'
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          BELT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: just test-browser-firefox
        if: matrix.engine == 'firefox'
        env:
          BELT_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}

  # ---------------------------------------------------------------------------
  # size -- the release build Trunk ships, and the brotli of each wasm
  # instance against its ceiling (`scripts/wasm_size.py`, budgets spec
  # section 5). The post-build hook writes the brotli copies.
  # ---------------------------------------------------------------------------
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev brotli
      - name: Install just and trunk
        uses: taiki-e/install-action@v2
        with:
          tool: just,trunk
      - uses: Swatinem/rust-cache@v2
        with:
          key: size
          # Only the default branch writes caches; feature branches restore
          # from main without consuming the shared 10 GB budget (avoids eviction).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just size

  # ---------------------------------------------------------------------------
  # test-wasm -- `cfg(target_arch = "wasm32")` surfaces (the application chrome:
  # leptos CSR + DOM) under headless Chrome via `cargo test` and
  # `wasm-bindgen-test-runner`. The pinned nightly + rust-src
  # (rust-toolchain.toml) supply `-Z build-std` for multi-threaded wasm. The crates it covers are listed in the `justfile`.
  # ---------------------------------------------------------------------------
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-wasm
          # Only the default branch writes caches; feature branches restore
          # from main without consuming the shared 10 GB budget (avoids eviction).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The test runner must be the `wasm-bindgen` version Cargo.lock pins: it
      # refuses a module another version wrote. The runner image ships Chrome
      # and a matching `chromedriver` on PATH, which the recipe falls back to.
      - name: wasm-bindgen version from Cargo.lock
        id: wasm_bindgen
        run: |
          version=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-test-runner
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm_bindgen.outputs.version }}
      # Clippy on the wasm target: the code host clippy never reads holds the
      # panic lints too (`ARCH-028`). Before the tests, so a lint fails fast.
      # The recipe also checks the Logic and app wasm test targets.
      - name: Toolchain (clippy)
        run: rustup component add clippy
      - run: just lint-wasm
      - run: just test-wasm

  # ---------------------------------------------------------------------------
  # coverage -- host-tier lcov baseline. Non-blocking: informative threshold
  # first (measure the baseline), regression target later.
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      # fontconfig dev headers: the font stack (fontique/parley via
      # ambre-draw/ambre-canvas) links the system fontconfig at build time.
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # No rust-cache here: coverage rebuilds everything with
      # `-C instrument-coverage` (artifacts unusable by other jobs) and its
      # cache alone is large enough to push the repo over the 10 GB budget,
      # evicting the caches that actually gate CI. Non-blocking job -> eat the
      # cold build rather than thrash the shared cache.
      - run: just cov
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # mutants -- mutation testing over the scope of `.cargo/mutants.toml`, on the
  # host tier (`ambre-spec-testing.md section 2`). Non-blocking, and on the
  # default branch alone. The whole scope took 1 h 56 min on four cores with
  # three jobs (measured 2026-11-05), so a branch push leaves it to
  # `mutants-diff`. Eight shards, each built in place in the restored cache.
  # Each uploads its report.
  # ---------------------------------------------------------------------------
  mutants:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev
      - name: Install just and cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-mutants
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 0 }}
      - run: just mutants ${{ matrix.shard }}/8 --in-place
      - name: Upload the mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # mutants-diff -- the mutants of the lines a pull request changes in the
  # scope of `.cargo/mutants.toml`. Blocking: a surviving mutant is a changed
  # line no test would fail on. A pull request outside the scope tests none.
  # A fix of 179 lines in ambre-sync took 4 min, build included (measured
  # 2026-11-05 on four cores).
  # ---------------------------------------------------------------------------
  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history: the diff reads the merge base with the base branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev
      - name: Install just and cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-mutants
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
          save-if: false
      - run: just mutants-diff origin/${{ github.base_ref }} --in-place
      - name: Upload the mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-diff
          path: mutants.out/
          if-no-files-found: ignore
