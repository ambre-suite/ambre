[package]
name = "ambre-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI Thread entry point: creates the inter-thread channels, spawns the Logic/Sync threads, and drives a FrameHost over the closed AppView registry."

[lib]
crate-type = ["cdylib"]

[dependencies]
ambre-bus    = { path = "../ambre-bus" }
# The launcher reads an `.ambre` header before it knows which application owns
# the file, so it names the container layer directly (`ambre-spec-docfile.md`).
ambre-core   = { path = "../ambre-core" }
ambre-canvas = { path = "../ambre-canvas" }
ambre-chrome = { path = "../ambre-chrome" }
ambre-draw   = { path = "../ambre-draw" }
ambre-trame  = { path = "../ambre-trame" }
ambre-toile  = { path = "../ambre-toile" }
# The Prose view state and its page painter; already in the graph through
# ambre-logic, named here because the host drives the view directly.
ambre-prose  = { path = "../ambre-prose" }
# The Murmure pane and the chrome that lays it out; already in the graph through
# ambre-logic, named here because the shell mounts that chrome.
ambre-murmure = { path = "../ambre-murmure" }
# `toile-pdf`: the deck's PDF export runs on the Logic thread, where the base
# font faces live (`toile-pdf-export`). The launcher is the build that ships it.
ambre-logic  = { path = "../ambre-logic", features = ["toile-pdf"] }
# NB: no dependency on ambre-sync -- the Sync worker is a SEPARATE wasm artifact
# (its own instance/memory), reached over postMessage, not linked as a crate.

# The frame driver (FrameHost) + the closed AppView registry live here now
# (moved out of ambre-canvas: a closed view enum naming TrameView cannot sit
# upstream of the app crates without a cycle). The driver owns the GPU
# orchestration, so the launcher names wgpu / parley / ambre-draw directly --
# previously reachable only transitively through ambre-canvas.
wgpu         = { workspace = true }
parley       = { workspace = true }

leptos       = { workspace = true }
leptos_router = { workspace = true }
leptos_icons = { workspace = true }
icondata     = { workspace = true }
tracing      = { workspace = true }
tracing-wasm = { workspace = true }
tracing-subscriber = { workspace = true }

# Encode SyncCommand / decode LogicEvent across the Sync-worker postMessage hop,
# and the clipboard ClipboardPayload onto the OS clipboard (`trame-clipboard`).
postcard     = { workspace = true }
# Base64 for transporting the postcard clipboard payload as a UTF-8 string.
base64       = { workspace = true }

# Entry point + Logic thread spawning (shared memory). The Sync worker is spawned
# directly via web_sys::Worker (separate instance), not through wasm_thread.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm_thread  = { workspace = true }
# Command keybinding listener (keydown on document).
web-sys      = { workspace = true }
js-sys = { workspace = true }

console_error_panic_hook = { workspace = true }

# The whole crate is `#![cfg(target_arch = "wasm32")]` (web_sys/wgpu/leptos), so
# even its pure helpers (route parsing, base64, FPS window) can only be exercised
# on the wasm target. Tests run in headless Chrome (`just test-wasm`); on host
# the crate is empty and the native tier skips it. See ambre-spec-testing.md.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# The recording surface, so the child paint pass is checked without a GPU.
ambre-draw = { path = "../ambre-draw", features = ["testing"] }
# A conversation fed to a Murmure view, so a cell's copy has text to write.
ambre-murmure = { path = "../ambre-murmure", features = ["testing"] }

[lints]
workspace = true
