[package]
name = "ambre-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Types fondamentaux d'Ambre (UUID, DocType, PublicKey)"

[features]
# Document-fixture machinery (`ambre-spec-fixtures.md`, `FIXTURE-007`). Non-default
# and host-only: `ambre-app` never names it, so no client build can pull the
# generator surface into wasm. Declared here because `FixtureGen` and the
# manifest types live in this crate -- the orphan rule puts the trait
# upstream of both app crates -- and every downstream crate re-declares
# `fixtures = ["ambre-core/fixtures"]` because a Cargo feature never enables its
# dependency's feature implicitly.
fixtures = []
# Test helpers other crates' tests call, such as `Seq::nth`. A
# `#[cfg(test)]` item of this crate reaches its own tests alone, so a
# downstream test names this feature in its `[dev-dependencies]`, and nowhere
# else: `tests/testing_feature.rs` refuses any other table that names it.
testing = []
# foldhash's fixed key in place of the key drawn per process (`src/hash.rs`).
# A random key moves the probes of each lookup, so a count of instructions
# moves from run to run. `scripts/instructions.py` alone names it, on its
# command line: every peer would share this key, so a shipped build that
# carried it would reopen HashDoS. It refuses to compile on wasm32, and
# `tests/fixed_hash_key_feature.rs` refuses any manifest or other command line
# that names it (`ARCH-087`).
fixed-hash-key = []

[dependencies]
# The sealed bytes of `encoded` travel as URL-safe base64, decoded when the
# body is read so a malformed one is refused there (`SRV-178`).
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The ciphertext of the envelope (`envelope`) keeps the wire form
# `ambre-protocol` gave it: a length-prefixed byte string, not a sequence of
# integers. A serde helper with no code of its own beyond that encoding. A
# fixed-width value does not use it: `fixed_bytes` writes its own form.
serde_bytes = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
# `Secret` (`secret`) wipes every secret of the workspace when it drops,
# whichever thread drops it.
zeroize = { workspace = true }
# `Secret` compares two secrets in constant time. Already in the tree through
# the RustCrypto stack; named here so the comparison is ours, not a `==`.
subtle = { workspace = true }
# `serde` feature: the file digest is `#[serde(with = "hex")]`, which reads
# `hex::serialize` / `hex::deserialize` off the crate root (`FIXTURE-011`). A
# raw `[u8; 32]` would serialize as 32 JSON integers and defeat the readable
# diff the sidecar exists for.
hex = { workspace = true, features = ["serde"] }
# The hash tables of every application (`src/hash.rs`, `ARCH-087`): foldhash
# under a key drawn once per process from the platform entropy source. A peer
# chooses the keys, so a key it can learn lets it force collisions. SipHash,
# the std default, cost about a sixth of the undo of a Trame block delete.
# Both are pure Rust and already in the lock, getrandom through uuid.
foldhash  = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }
serde_json = { workspace = true }
# `tests/testing_feature.rs` reads every workspace manifest, so the `testing`
# feature provably stays out of a shipped build (`ARCH-055`).
toml = { workspace = true }

[lints]
workspace = true
