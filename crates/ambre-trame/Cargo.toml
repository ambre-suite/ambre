[package]
name = "ambre-trame"
version = "0.1.0"
edition = "2024"
description = "Trame (spreadsheet) application -- IPC types, logic controller, and UI renderer"

[dependencies]
tracing  = { workspace = true }

# Logic side (Logic thread): TrameState, CRDT / formula engine.
ambre-bus = { path = "../ambre-bus" }
loro      = { workspace = true }
petgraph  = { workspace = true }
nom       = { workspace = true }

# UI side (UI Thread): DrawSurface renderer, text layout, frame channels.
ambre-draw = { path = "../ambre-draw" }
ambre-canvas   = { path = "../ambre-canvas" }
# UI Thread <-> Logic frame channels (shared memory, Main instance).
flume      = { workspace = true }
web-sys    = { workspace = true }
