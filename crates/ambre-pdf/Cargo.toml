[package]
name = "ambre-pdf"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "KrillaSurface: DrawSurface implementation for PDF export (Logic thread, lazy-loaded)"

[dependencies]
ambre-draw = { path = "../ambre-draw" }
kurbo = { workspace = true }
peniko = { workspace = true }
# default-features off: we skip the simple-text draw_text helper and rayon to
# keep the lazy-loaded PDF chunk small on wasm. `raster-images` is enabled so
# `KrillaSurface::draw_image` can embed Toile media (`toile-pdf-export`,
# `toile-media`).
krilla = { workspace = true, features = ["raster-images"] }

[lints]
workspace = true
