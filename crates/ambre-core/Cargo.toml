[package]
name = "ambre-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Types fondamentaux d'Ambre (UUID, DocType, PublicKey)"

[features]
# Document-fixture machinery (`ambre-spec-fixtures.md`, `FIXTURE-007`). Non-default
# and host-only: `ambre-app` never names it, so no client build can pull the
# generator surface into wasm. Declared here because `FixtureGen` and the
# manifest types live in this crate -- the orphan rule puts the trait
# upstream of both app crates -- and every downstream crate re-declares
# `fixtures = ["ambre-core/fixtures"]` because a Cargo feature never enables its
# dependency's feature implicitly.
fixtures = []

[dependencies]
# The sealed bytes of `encoded` travel as URL-safe base64, decoded when the
# body is read so a malformed one is refused there (`SRV-178`).
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The ciphertext of the envelope (`envelope`) keeps the wire form
# `ambre-protocol` gave it: a length-prefixed byte string, not a sequence of
# integers. A serde helper with no code of its own beyond that encoding. A
# fixed-width value does not use it: `fixed_bytes` writes its own form.
serde_bytes = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
# `Secret` (`secret`) wipes every secret of the workspace when it drops,
# whichever thread drops it.
zeroize = { workspace = true }
# `Secret` compares two secrets in constant time. Already in the tree through
# the RustCrypto stack; named here so the comparison is ours, not a `==`.
subtle = { workspace = true }
# `serde` feature: the file digest is `#[serde(with = "hex")]`, which reads
# `hex::serialize` / `hex::deserialize` off the crate root (`FIXTURE-011`). A
# raw `[u8; 32]` would serialize as 32 JSON integers and defeat the readable
# diff the sidecar exists for.
hex = { workspace = true, features = ["serde"] }

[dev-dependencies]
postcard = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
