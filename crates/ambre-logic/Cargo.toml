[package]
name = "ambre-logic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Logic layer — CRDT dispatch, AppController registry, viewport computation. Runs as a Worker today; will become a thread in the multi-threaded WASM migration."

[dependencies]
ambre-bus   = { path = "../ambre-bus" }
ambre-core  = { path = "../ambre-core" }
ambre-trame = { path = "../ambre-trame" }

# App logic deps (heavy -- must not appear in ambre-trame or ambre-app)
loro     = { workspace = true }
petgraph = { workspace = true }

serde    = { workspace = true }
postcard = { workspace = true }
flume    = { workspace = true }
tracing      = { workspace = true }
tracing-wasm = { workspace = true }

wasm-bindgen             = { workspace = true }
js-sys                   = { workspace = true }
web-sys                  = { workspace = true }
console_error_panic_hook = { workspace = true }
