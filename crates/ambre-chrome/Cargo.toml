[package]
name = "ambre-chrome"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared, app-agnostic Leptos chrome toolkit: AppShell, command palette, menus, dialogs, toolbars, toasts, status bar. Built on leptos + ambre-commands; depends on no app crate."

[features]
# The gallery page of the visual system (`ambre-spec-testing.md` section 2):
# every control primitive in each state, which the browser tier records as a
# computed-style snapshot. A test build turns it on through
# `ambre-app/chrome-gallery`; no release build does.
gallery = []

[dependencies]
ambre-commands = { path = "../ambre-commands" }
# The colour packings the colour picker edits (`Rgb`, `Rgba`).
ambre-core     = { path = "../ambre-core" }
ambre-client-core = { path = "../ambre-client-core" }
leptos         = { workspace = true }
# Tree-shaken SVG icons for the context-menu entries (grouped/iconed menu,
# `trame-context-menu`). Same crates the app chrome already uses.
leptos_icons   = { workspace = true }
icondata       = { workspace = true }
# DOM keyboard event -> KeyBinding translation, native <dialog> control.
web-sys        = { workspace = true }
wasm-bindgen   = { workspace = true }
# The entries a `ResizeObserver` hands each floating surface it watches
# (`cover`, `CHROME-171`). The application already links it.
js-sys         = { workspace = true }

# Reactive/DOM tests for the chrome components (Epic `ET`,
# ambre-spec-testing.md "wasm" tier): leptos CSR + real `document`, so
# they run under the wasm target in headless Chrome (`just test-wasm`). On
# host they are gated out and the native tier runs only the pure `#[test]`s in
# `src/`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# A native `<dialog>` fires `close` on a later task: the tests await one.
js-sys               = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true
