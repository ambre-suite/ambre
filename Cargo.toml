[workspace]
resolver = "2"
# A patched third-party crate, built as a dependency and never linted as ours.
exclude = ["vendor"]
members = [
    "crates/ambre-core",
    "crates/ambre-commands",
    "crates/ambre-chrome",
    "crates/ambre-canvas",
    "crates/ambre-crypto",
    "crates/ambre-protocol",
    "crates/ambre-bus",
    "crates/ambre-crdt",
    "crates/ambre-draw",
    "crates/ambre-pdf",
    "crates/ambre-opc",
    "crates/ambre-pptx",
    "crates/ambre-convert",
    "crates/ambre-xlsx",
    "crates/ambre-docx",
    "crates/ambre-odt",
    "crates/ambre-logic",
    "crates/ambre-sync",
    "crates/ambre-call",
    "crates/ambre-trame",
    "crates/ambre-prose-form",
    "crates/ambre-prose",
    "crates/ambre-toile",
    "crates/ambre-murmure",
    "crates/ambre-app",
    "crates/ambre-server",
    "crates/ambre-metrics",
    "crates/ambre-sfu",
    "crates/ambre-belt",
    "crates/ambre-primitives",
]
# Server excluded from default builds: it's a native target (tokio/mio)
# and would fail wasm32 compilations. Build it explicitly:
#   cargo check -p ambre-server
# or with the host target:
#   cargo check --target x86_64-unknown-linux-gnu
default-members = [
    "crates/ambre-core",
    "crates/ambre-commands",
    "crates/ambre-chrome",
    "crates/ambre-canvas",
    "crates/ambre-crypto",
    "crates/ambre-protocol",
    "crates/ambre-bus",
    "crates/ambre-crdt",
    "crates/ambre-draw",
    "crates/ambre-pdf",
    "crates/ambre-opc",
    "crates/ambre-pptx",
    "crates/ambre-convert",
    "crates/ambre-xlsx",
    "crates/ambre-docx",
    "crates/ambre-odt",
    "crates/ambre-logic",
    "crates/ambre-sync",
    "crates/ambre-call",
    "crates/ambre-trame",
    "crates/ambre-prose-form",
    "crates/ambre-prose",
    "crates/ambre-toile",
    "crates/ambre-murmure",
    "crates/ambre-app",
]

[workspace.dependencies]
# Common
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_bytes = "0.11"
hex = "0.4"
uuid = { version = "1.0", features = ["v7", "js"] }
postcard = { version = "1.0", features = ["alloc"] }
rustc-hash = "2.0"
thiserror = "2.0"
# CSV import/export for Trame interop (pure Rust, WASM-compatible, RFC 4180).
csv = "1.3"
# The OOXML codecs (`ambre-docx`, `4-Prose/features/ambre-spec-prose-import-export.md`;
# `ambre-xlsx`, `ambre-spec-trame-import-export.md` section 3;
# `ambre-pptx`, `3-Toile/features/ambre-spec-toile-pptx-export.md`).
# The OPC package is a zip archive of XML parts, stored or deflated. `zip`
# reads and writes the archive with deflate alone: no encryption, bzip2,
# zstd, lzma or timestamp. `flate2` is pinned here to fix its backend,
# `miniz_oxide`, pure Rust, which reads and writes deflate. `quick-xml` reads
# the parts as a stream of events, with no feature. All three build for
# wasm32-unknown-unknown. An entry of another method is a typed error.
zip       = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
flate2    = { version = "1.1", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "0.42", default-features = false }
# The time-zone rules a Word date is read and written in, with the tz database
# bundled: a wasm module has no system database to read.
jiff      = { version = "0.2", default-features = false, features = ["alloc", "tzdb-bundle-always"] }
tracing      = "0.1"
tracing-wasm = "0.2"
zeroize = { version = "1.7" }
# Constant-time equality for `ambre_core::Secret`. Pure Rust, already in the tree
# through the RustCrypto stack (`ambre-spec-zero-knowledge.md` section 2).
subtle = { version = "2.6", default-features = false }
async-trait = "0.1"

# Crypto
chacha20poly1305 = { version = "0.10" }
ed25519-dalek = { version = "2.0" }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
blake2 = { version = "0.10" }
argon2 = { version = "0.5" }
hkdf = { version = "0.12" }
hmac = { version = "0.12" }
sha2 = { version = "0.10" }
# Constant-time, allocation-light base32/base64 codecs (pure Rust, WASM-safe).
# Used for the TOFU public-key fingerprint (BASE32 RFC 4648, no padding).
data-encoding = "2.11"
# CSPRNG for nonces and key material. `wasm_js` selects the browser entropy
# backend (crypto.getRandomValues) on wasm32-unknown-unknown.
getrandom = { version = "0.3", features = ["wasm_js"] }
# The hasher of the tables of every application (`ambre_core::hash`). Pure Rust, no dependency, and
# already in the lock under hashbrown. Keyed by `getrandom`, never by its own
# address-based key, which is fixed on wasm32-unknown-unknown.
foldhash = { version = "0.2", default-features = false, features = ["std"] }

# Already in the lockfile under leptos. The gate parses each manifest and each
# cargo config as TOML, as cargo reads them, rather than matching their text.
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }

# Test-only
proptest = "1"
criterion = { version = "0.5", default-features = false }
# The `mutants::skip` attribute that cargo-mutants reads. A crate names it as
# a dev-dependency, behind `cfg_attr(test, ...)`: no shipped build carries it.
mutants = "0.0.4"

# UI
# Chrome DOM framework (client-side rendering only). `csr` selects the
# browser-target reactive runtime; default features (ssr/hydrate plumbing) are
# off to keep the WASM bundle lean and avoid server-only deps.
leptos    = { version = "0.8", default-features = false, features = ["csr"] }
# Client-side router (pushState navigation, no full page load). CSR: no SSR
# features, matching the pure-client leptos build.
leptos_router = { version = "0.8", default-features = false }
# Tree-shaken SVG icons: only the `icondata` constants we reference are
# embedded in the WASM bundle (one <Icon icon=.../> -> one inlined <svg>).
leptos_icons = { version = "0.7" }
icondata     = { version = "0.7" }
wgpu    = { version = "28.0", features = ["webgl"] }
# 0.10, not 0.12: it reads fonts through the skrifa 0.42 and read-fonts 0.39
# that krilla links, so Main carries one copy of each (`deny.toml` holds it).
parley  = "0.10"
kurbo   = { version = "0.13", features = ["serde"] }
peniko  = "0.6"
bytemuck = { version = "1", features = ["derive"] }
# Path tessellation (phase 1: fill_path / stroke_path)
lyon = "1"
# 2D polygon boolean ops (union / subtract / intersect / exclude) for the
# Toile vector boolean feature (`toile-vector-paths`). Pure Rust, WASM-friendly;
# kurbo has no path-vs-path booleans, so shapes are flattened to polygons here.
i_overlay = "7.0"
# Glyph rasterization (phase 2: GlyphAtlas) -- match parley's transitive dep
swash = "0.2"

# Toile interop (`toile-import-export`). Pure-Rust SVG parse -> normalized tree that
# the SVG importer walks into ToileCommands; pure-Rust raster codecs for PNG/JPG
# image import + thumbnail encoding. Both are WASM-compatible and loaded only on
# the interop path (`toile-media`). `image` keeps a tight codec set (png/jpeg)
# to limit the WASM binary contribution.
#
# usvg drops its default font stack (`text`, `system-fonts`, `memmap-fonts`): the
# browser has no system fonts, so usvg's text-to-glyph-path flattening cannot run
# in WASM and would also destroy editable text. Toile keeps `<text>` editable by
# extracting the raw string/position via `roxmltree` and rendering it through its
# own Parley text stack (`toile-import-export`). Dropping the font stack also trims
# the WASM binary contribution.
usvg = { version = "0.47", default-features = false }
# The version usvg 0.47 links, so the Main instance carries one copy of the
# parser and not two (`ambre-spec-budgets.md` section 5).
roxmltree = "0.21"
# PNG alone: the JPEG decoder lives in the images converter module
# (`zune-jpeg` below), so Main links none (`ARCH-078`). A crate whose tests
# write a JPEG fixture turns `jpeg` on in its dev-dependencies alone.
image = { version = "0.25", default-features = false, features = ["png"] }
# The WebP decoder the images converter module runs, the one `image` wraps
# (`ambre-spec-budgets.md section 5`). Decoding only: the module never calls
# its lossless encoder, which the tests alone use to write their fixtures.
image-webp = { version = "0.2", default-features = false }
# The JPEG decoder the images converter module runs, the one `image` wraps.
# No SIMD feature: the module builds for wasm32.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

# WASM
gloo-net = { version = "0.7", features = ["http", "websocket"] }
web-sys = { version = "0.3.85", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ClipboardEvent",
    # The wasm tier raises real pipe events (`ambre-spec-text-input.md`).
    "ClipboardEventInit",
    "ClipboardItem",
    "CompositionEvent",
    "CompositionEventInit",
    "DataTransfer",
    "DragEvent",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlDialogElement",
    "HtmlDocument",
    "HtmlElement",
    "HtmlTextAreaElement",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "Node",
    # `query_selector_all`. The DOM belts already call it; it built only because
    # a larger dependency graph unified the feature in, so a crate tested alone
    # lost the method. Declared here, it is no longer an accident.
    "NodeList",
    # The system notifications of an open tab (the Murmure notifications spec).
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "DedicatedWorkerGlobalScope",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "Performance",
    "PointerEvent",
    "PointerEventInit",
    "Request",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Response",
    "WebSocket",
    "WheelEvent",
    "Window",
    "UrlSearchParams",
    # The provider sign-in: the return address is replaced once read, and the
    # state of the sign-in a tab started is kept for that tab alone.
    "History",
    "Storage",
] }
js-sys = "0.3.85"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
# Multi-threaded WASM — std::thread replacement that spawns Web Workers under
# the hood. Required for the shared-linear-memory threading model documented
# in specs/1-Foundations/ambre-spec-architecture.md.
wasm_thread = "0.3"
# The queues under `ambre_bus::conduit`, the channels of every client thread. They
# take no lock, where flume's `std::sync::Mutex` ends in `Atomics.wait` when the
# page's main thread finds it contended, which the browser refuses (`ARCH-020`).
crossbeam-queue = "0.3"
# The lock-free wake-up behind `ambre_bus::conduit::Receiver::recv`, the one
# `futures` itself uses. A plain `Waker` behind a `Mutex` is what `ARCH-020` bans.
atomic-waker = "1.1"
# The one-shot answers of the IndexedDB store, awaited on the main thread.
futures-channel = "0.3"

# Compression
ruzstd = "0.9"

# CRDT
loro = "1.10"

# Text: word and grapheme boundaries (UAX #29), budgeted in
# `ambre-spec-budgets.md section 5`.
unicode-segmentation = "1.13"

# Formula parsing
nom = "8.0"

# Graph
petgraph = "0.8"
rstar = "0.12"

# Server (native target, not wasm32)
tokio             = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum              = { version = "0.8", features = ["ws"] }
tower             = "0.5"
tower-http        = { version = "0.6", features = ["catch-panic", "cors", "trace"] }
futures-util      = "0.3"
sqlx              = { version = "0.8", features = ["postgres", "uuid", "chrono", "runtime-tokio-rustls"] }
rustis            = "0.27.3"
# `default-features = false` drops exactly one default feature: `rustls`, which
# is the SDK alias for `aws-smithy-runtime/tls-rustls` -- the *legacy* client
# stack (hyper 0.14 / rustls 0.21), and with it `h2` 0.3 and `rustls-webpki`
# 0.101, all four carrying open advisories. The remaining features are the
# other defaults verbatim, so the modern `default-https-client` (hyper 1 /
# rustls 0.23) is the only HTTP path left. See `deny.toml` and
# `ambre-spec-testing.md §8`.
aws-sdk-s3        = { version = "1.128", default-features = false, features = ["behavior-version-latest", "sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
chrono            = { version = "0.4", features = ["serde"] }
base64            = "0.22"
time              = "0.3"
openidconnect     = "4"
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url               = "2"
# The query encoder of ambre-sync; the lockfile already holds it through url.
percent-encoding  = "2.3"
jsonwebtoken      = "9"

# Import/export
# default-features off: consumers (ambre-pdf) opt into only the vector/glyph
# core, keeping the PDF code Main carries small on wasm (no raster-images,
# simple-text, or rayon unless explicitly enabled).
krilla = { version = "0.8", default-features = false }
html5ever = "0.39"
pulldown-cmark = { version = "0.13", default-features = false }


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# A test run executes the dependency graph, it does not only compile it:
# Argon2id hashes 64 MiB three times over per derivation, and the CRDT engine
# replays 256 generated op programs per convergence property. Unoptimized, those
# two tests alone took 33 s of the 42 s the native tier spent running. Optimized,
# the whole tier runs in 3 s. A dependency is compiled once and cached, so this
# is paid at the first build and refunded on every run after it; our own crates
# stay unoptimized, which is what keeps an incremental rebuild short.
# A public item states its contract and its failures
# (`ai/ambre-writing-style.md`). `clippy` holds the failure half exactly, so no
# script of `scripts/` repeats it. `deny` and not `warn`: `just lint` runs
# `-D warnings`, so a warning fails the gate all the same, and the value that
# reads as the truth is the one written here.
[workspace.lints.rust]
# The "no `unsafe`" pillar of `README.md`, held by the build: every crate
# inherits this table (`ARCH-032`), so none can open an unchecked block.
unsafe_code = "forbid"
# A kept silence whose reason is gone fails the build (`ARCH-068`). `deny` and
# not the default `warn`: the value that reads as the truth is the one written
# here, as the comment above the table states.
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
missing_errors_doc = "deny"
missing_panics_doc = "deny"
# No panic path outside the tests (`ARCH-028`). The root `clippy.toml` lifts
# these inside `#[cfg(test)]`; a site kept on purpose carries an `#[expect]`
# with its reason.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
# No lint silenced without its reason (`ARCH-068`): a kept site carries an
# `#[expect]` with a `reason`, never an `#[allow]`.
allow_attributes = "deny"

[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is never stepped through, and it is most of what makes
# `target/` tens of gigabytes. Dropping it cuts the tree and the link step that
# writes it out; a backtrace through our own crates keeps its symbols.
debug = false

# The call simulation of `ambre-sfu` runs on simulated time, so its tests spend
# CPU alone, and the guard of `CALL-053` runs the suite four times. Unoptimized,
# the suite set the length of the CI job `test-native` (`ambre-spec-budgets.md`
# section 7). The `test` profile leaves clippy and the dev build untouched.
[profile.test.package.ambre-sfu]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The two wasm builds Trunk ships (`crates/ambre-app/index.html`). The download
# is the budget there (`ambre-spec-budgets.md` section 5), so every crate is
# built for size, and the name section goes: 1 MB gzip of function names. "z"
# over "s": "s" weighs 12% more in brotli on the Main instance. The relay keeps
# `release`, built for speed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = "symbols"
# A panic location keeps its file and line, but the path starts at the crate:
# no registry or toolchain path of the build machine. Main weighs 1.1 KB less
# in brotli, and two machines build the same bytes.
trim-paths = "all"

# str0m's RustCrypto backend made its DTLS certificate through rcgen, which
# links aws-lc-sys, a C library. The vendored copy builds it from RustCrypto
# alone, so the SFU links no C cryptography (`CALL-013`). Drop it once
# str0m ships the same change.
#
# str0m keeps its estimate of each downlink to itself. The vendored copy hands the
# transport-wide feedback to the SFU and takes the SFU's estimate back, so the SFU
# runs its own congestion control (`vendor/str0m/PATCH.md`).
#
# wasm_thread reads its global scope, its glue path and a worker polyfill through
# `eval`, which the content policy of the page refuses (`SRV-260`). The vendored
# copy calls no eval, and builds no blob for a worker script the page ships
# (`vendor/wasm_thread/PATCH.md`).
[patch.crates-io]
str0m-rust-crypto = { path = "vendor/str0m-rust-crypto" }
str0m = { path = "vendor/str0m" }
wasm_thread = { path = "vendor/wasm_thread" }
