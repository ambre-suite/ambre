# Atomics + bulk-memory + mutable-globals are required to compile std with
# threading support on wasm32. Combined with `-Z build-std` below, this rebuilds
# the standard library against `+atomics`, which is the prerequisite for
# `WebAssembly.Memory` backed by a `SharedArrayBuffer` and for `std::thread`
# semantics in the browser.
#
# Active only on wasm32 targets to avoid affecting host-side builds (workspace
# tests on x86_64, etc.).
[target.wasm32-unknown-unknown]
rustflags = [
    # Enable atomic ops, bulk memory and mutable globals on wasm — required to
    # compile std with threading support.
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
    # `+atomics` is still an *unstable* wasm target-feature, so rustc emits a
    # hard-coded, non-actionable warning ("unstable feature specified for
    # `-Ctarget-feature`: `atomics`") for every single crate. It has no lint
    # name, so it can't be `#[allow]`-ed; `-A warnings` is the only switch that
    # silences it. Scoped to wasm32 ONLY: host builds (cargo check/clippy/test
    # on x86_64) keep all warnings, so the only blind spot is wasm-exclusive
    # code (ambre-app, ambre-canvas::host). Remove this line to audit those.
    "-A", "warnings",
    # Without these two flags, LLD emits a non-shared memory even when atomics
    # are on. A non-shared WebAssembly.Memory cannot be transferred to a Worker
    # via postMessage (DataCloneError), so wasm_thread::spawn panics on the
    # first thread it tries to start.
    #
    # `--shared-memory` flips the memory section to `(memory (shared ...))`.
    # `--max-memory` is mandatory for shared memories; 4 GiB is the wasm32 cap.
    # `--import-memory` makes the wasm import its memory from JS instead of
    # defining it locally — required by wasm-bindgen's `threads` transform,
    # which asserts `mem.import.is_some()`. JS creates one shared Memory and
    # hands it to every worker that instantiates the same module, giving them
    # a common heap.
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--max-memory=4294967296",
    "-C", "link-arg=--import-memory",
    # wasm-bindgen's threads transform expects these TLS helpers to be exported
    # by wasm-ld. LLD generates them when atomics + TLS are in scope, but won't
    # export them by name unless asked. Without these exports, wasm-bindgen
    # fails with `failed to find __wasm_init_tls`.
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
    # The threads transform of wasm-bindgen injects the thread id at
    # `__heap_base`. rustc of nightly-2026-03-29 exported it on wasm32 by
    # default, and nightly-2026-11-11 no longer does: without this line,
    # wasm-bindgen fails with `failed to find __heap_base`.
    "-C", "link-arg=--export=__heap_base",
]

[unstable]
build-std = ["std", "panic_abort"]
# Lets the `wasm-release` profile below pass a flag to `core` and `alloc` alone.
profile-rustflags = true

# The addresses of the local stack of `docker-compose.yml`, the same as CI.
# Cargo gives them to each process it starts, so the db tier and
# `cargo run -p ambre-server` need no `.env`. `#[sqlx::test]` reads
# `DATABASE_URL` itself, and the test helpers refuse a run with no
# `S3_ENDPOINT`. With `force = false`, a variable of the shell wins.
# No crate uses the `sqlx::query!` macros, so the build does not read the
# database; a macro of that kind would make each build need Postgres.
[env]
DATABASE_URL = { value = "postgres://ambre:ambre@localhost:5432/ambre_dev", force = false }
REDIS_URL = { value = "redis://localhost:6379", force = false }
S3_ENDPOINT = { value = "http://localhost:9000", force = false }

# The shipped wasm builds `core` and `alloc` for size: one small sort per type
# in place of driftsort and ipnsort, and small integer formatting. On
# 2026-11-17 the cut took 462 KB off the raw Main wasm, 4.3 %
# (`ambre-spec-budgets.md section 5`). The `build-std-features` key would set
# it for every target, and the host instruction counts then failed by 1 %. A
# profile flag scopes it to `wasm-release`: the relay, the host tests and the
# counts keep the standard library as rustc ships it. `optimize_for_size` is a
# feature that `core` declares, so the `--cfg` is the one that feature sets.
[profile.wasm-release.package.core]
rustflags = ["--cfg", 'feature="optimize_for_size"']

[profile.wasm-release.package.alloc]
rustflags = ["--cfg", 'feature="optimize_for_size"']
