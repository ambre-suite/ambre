[package]
name = "ambre-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU content-rendering runtime for the Ambre UI thread (wgpu surface, quad/glyph pipeline, GPU bootstrap + rAF loop). Chrome lives in the DOM (ambre-chrome)."

# The token generator (`ambre-spec-design-tokens.md`): `just tokens-write`
# parses `tokens.ron` into the committed `src/theme_gen.rs` and `src/theme.css`,
# and `just tokens-check` fails when either one is stale. Non-default, so no
# client build links a RON parser.
[features]
tokens = ["dep:serde", "dep:ron"]

[dependencies]
# The token source reader, behind `tokens`. Both were the build dependencies of
# the build script this binary replaces, so the tree gains no crate.
serde = { workspace = true, optional = true }
ron   = { version = "0.8", optional = true }

ambre-bus  = { path = "../ambre-bus" }
# The keys and modifiers an input event carries (`Key`, `Modifiers`).
ambre-commands = { path = "../ambre-commands" }
# The pixel spaces a plan and a size are typed in (`Px<View>`, `Px<CanvasCss>`).
ambre-core = { path = "../ambre-core" }
ambre-draw = { path = "../ambre-draw" }

# Rendering
wgpu       = { workspace = true }
bytemuck   = { workspace = true }
swash      = { workspace = true }
parley     = { workspace = true }
rustc-hash = { workspace = true }
kurbo      = { workspace = true }
peniko     = { workspace = true }
lyon       = { workspace = true }

# DOM glue for the transparent <textarea> pipe (text_input.rs). Pure web_sys
# bindings: they compile on every target, so app crates can name `TextInput`
# in host-side tests even though it only does anything in the browser.
web-sys      = { workspace = true }
wasm-bindgen = { workspace = true }

# UI Thread host plumbing (GPU bootstrap + rAF loop). wasm32-only: surface
# creation from a canvas and the rest of the web_sys glue don't exist on native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys               = { workspace = true }
wasm-bindgen-futures = { workspace = true }
tracing              = { workspace = true }

# `required-features` keeps the generator out of every other build, the wasm
# one included.
[[bin]]
name = "ambre-tokens"
path = "src/bin/ambre-tokens.rs"
required-features = ["tokens"]

[dev-dependencies]
# The recording surface the fatal screen is painted on in a host test.
ambre-draw = { path = "../ambre-draw", features = ["testing"] }
# `Generation::nth` for a test that names a count. Test builds alone, held by
# `ambre-core/tests/testing_feature.rs` (`ARCH-055`).
ambre-core = { path = "../ambre-core", features = ["testing"] }

[lints]
workspace = true
