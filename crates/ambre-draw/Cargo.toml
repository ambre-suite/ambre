[package]
name = "ambre-draw"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Abstraction trait for shared rendering (screen & PDF) in Ambre"

[features]
# Headless test doubles (RecordingSurface, FixedClock). Off by default so the
# production build never carries them; enabled by downstream crates' dev-deps.
testing = []

[dependencies]
# Scoped exception to the "kurbo/peniko/parley only" rule: `peer::peer_color`
# is seeded on the canonical `Id<User>` so the newtype is preserved end-to-end
# through every presence path. Types only -- no GPU, no crypto.
ambre-core = { path = "../ambre-core" }
kurbo = { workspace = true }
peniko = { workspace = true }
parley = { workspace = true }
# The recorded draw list crosses into the converter module as postcard bytes
# (`list`, `ambre-spec-drawing-surface.md`).
serde = { workspace = true }

[lints]
workspace = true
