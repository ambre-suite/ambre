[package]
name = "ambre-crypto"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Cryptographic primitives for Ambre (AEAD, signatures, hashing, KDF, key derivation)"

[features]
# The seed a development sign-in derives from a name (`ZK-045`). Anyone who
# knows the name derives every key, so no release build turns it on: the
# post-build hook refuses a release whose wasm carries it.
dev-login = []

[dependencies]
ambre-core = { path = "../ambre-core" }
ambre-client-core = { path = "../ambre-client-core" }
thiserror = { workspace = true }

# Crypto
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
blake2 = { workspace = true }
argon2 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }

# getrandom 0.2 is pulled in transitively (rand_core, via the RustCrypto
# stack). On wasm32 it needs its "js" backend enabled; declaring it here with
# the feature lets Cargo's feature unification turn it on for the whole graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
# The hex goldens, and the reference that the base32 fingerprint is checked
# against. The fingerprint itself is hand-written: the generic encoder of this
# crate linked 18 KB into the Sync worker.
data-encoding = { workspace = true }
criterion = { workspace = true }
# The JSON line the phone page prints (`tests/phone_bench.rs`).
serde_json = { workspace = true }

# proptest pulls `wait-timeout`, which does not build on wasm32, so it is gated
# to the host target as ambre-murmure does.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }

# The phone page times the seal, the open and the wraps of a space leave in the
# browser (`tests/phone_bench.rs`, `just phone-measures crypto`).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { workspace = true }

[[bench]]
name = "crypto"
harness = false

[lints]
workspace = true
