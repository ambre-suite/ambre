[package]
name = "ambre-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared command registry: CommandId/Command/CommandState/CommandSource plus keybinding resolution. Leaf affordance crate with zero UI dependencies (ambre-spec-commands.md)."

[dependencies]
# The leaf of the UI-thread crate graph: depended on by every app AND by
# ambre-chrome, it must stay framework-agnostic. Pure data + pure functions,
# fully testable on the host. It reaches `ambre-core` alone, for the choices
# the bus carries too (`ambre-spec-architecture.md`).
ambre-core = { path = "../ambre-core" }

[lints]
workspace = true
