[package]
name = "ambre-prose"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Word processing application for Ambre — rich text, layout, import/export"

[features]
# Document-fixture machinery (`ambre-spec-fixtures.md`, `FIXTURE-007`).
# Non-default and host-only. It forwards `ambre-core/fixtures` explicitly: a
# Cargo feature never enables its dependency's feature implicitly, and the gated
# code names `ambre_core::FixtureShape`.
fixtures = ["ambre-core/fixtures"]

[dependencies]
ambre-core = { path = "../ambre-core" }
ambre-bus = { path = "../ambre-bus" }

# Family resolution and script classification, shared with the renderers
# (`CANVAS-017`). Pagination must resolve a label exactly as the UI thread
# does, or two peers break pages differently (`PROSE-108`). ambre-draw is the
# lightest crate that holds it: geometry, colour and text, no graphics stack.
ambre-draw = { path = "../ambre-draw" }
serde = { workspace = true }
tracing = { workspace = true }

# CRDT: `LoroMovableTree` for the block hierarchy, `LoroText` for a body,
# `LoroMap` for the registers, `UndoManager` for the local history
# (`features/ambre-spec-prose-engine.md section 3`).
loro = { workspace = true }

# The presence frame, and nothing else: a CRDT delta is already bytes
# (`features/ambre-spec-prose-engine.md section 3.D`).
postcard = { workspace = true }

# The typographic layout pagination measures with: line breaking and glyph
# metrics, not just the run types a draw surface exposes
# (`features/ambre-spec-prose-engine.md section 5`). Only parley -- not the
# whole GPU canvas crate -- so the Logic worker's wasm stays lean.
parley = { workspace = true }

# Word and grapheme boundaries for the word count (UAX #29). A character is a
# grapheme cluster and a word is a word segment holding a letter or a digit
# (`features/ambre-spec-prose-word-count.md section 2`), and neither can be
# answered from `char` alone. Already in the graph through `convert_case`, and
# budgeted in `ambre-spec-budgets.md section 5`.
unicode-segmentation = { workspace = true }

# The UI -> Logic channel the view sends on. Shared memory between the two
# threads, so a command moves rather than serializes.
flume = { workspace = true }


# Placement holds universal rules over an unenumerated input space: a walk that
# terminates, a page it never goes back to, and a cut only ever taken at a line
# (`PROSE-017`, `PROSE-078`, `PROSE-071`). proptest pulls `wait-timeout`, which
# does not build on wasm32, and placement is host-testable, so it is gated to
# the host target as ambre-toile and ambre-trame do.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }
# The recording surface: the painter is driven against it and its ordered
# draw calls are asserted on, off any GPU (`PROSE-UI-117`, `PROSE-UI-118`).
# The same crate as the runtime dependency, with its test double switched on.
ambre-draw = { path = "../ambre-draw", features = ["testing"] }

[lints]
workspace = true
