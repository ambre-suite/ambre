[package]
name = "ambre-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU content-rendering runtime for the Ambre UI thread (wgpu surface, quad/glyph pipeline, DocView contract). Chrome lives in the DOM (ambre-chrome)."

[dependencies]
ambre-draw = { path = "../ambre-draw" }

# Rendering
wgpu       = { workspace = true }
bytemuck   = { workspace = true }
swash      = { workspace = true }
parley     = { workspace = true }
rustc-hash = { workspace = true }
kurbo      = { workspace = true }
peniko     = { workspace = true }

# Content a11y: AccessKit exposes the canvas content tree to screen readers
# (scoped to content; chrome a11y is native DOM in ambre-chrome).
accesskit  = { workspace = true }

# DOM glue for the transparent <textarea> pipe (text_input.rs). Pure web_sys
# bindings: they compile on every target, so app crates can name `TextInput`
# in host-side tests even though it only does anything in the browser.
web-sys      = { workspace = true }
wasm-bindgen = { workspace = true }

# UI Thread host plumbing (GPU bootstrap + rAF loop). wasm32-only: surface
# creation from a canvas and the rest of the web_sys glue don't exist on native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys               = { workspace = true }
wasm-bindgen-futures = { workspace = true }
tracing              = { workspace = true }
