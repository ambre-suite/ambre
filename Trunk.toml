[build]
target = "crates/ambre-app/index.html"
filehash = false

[serve]
port = 8080
open = true

[serve.proxy]
"/api" = "http://127.0.0.1:3000"
"/ws"  = "http://127.0.0.1:3000"

# Cross-Origin Isolation: required to enable SharedArrayBuffer (and therefore
# WebAssembly.Memory shared = true), the bedrock for the multi-threaded WASM
# model described in specs/ambre-multithreaded-wasm-migration.md.
#
# COOP=same-origin isolates this top-level browsing context from popups/openers.
# COEP=credentialless strips credentials from cross-origin sub-resource fetches
# (less invasive than `require-corp`, which would force every third-party asset
# to opt in via CORP headers).
[serve.headers]
"Cross-Origin-Opener-Policy" = "same-origin"
"Cross-Origin-Embedder-Policy" = "credentialless"

[profile.dev]
wasm_opt = false # disable wasm optimization for faster builds during development

[profile.release]
# wasm_opt disabled — Binaryen 116 (shipped with Trunk 0.21.13) cannot parse
# wasm modules built with `+atomics` from rustc nightly. See the rationale in
# crates/ambre-app/index.html. Re-enable once Trunk ships Binaryen 117+ or
# wire a manual post-step against a newer binaryen.
wasm_opt = false