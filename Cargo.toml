[workspace]
resolver = "2"
members = [
    "crates/ambre-core",
    "crates/ambre-ui",
    "crates/ambre-crypto",
    "crates/ambre-protocol",
    "crates/ambre-bus",
    "crates/ambre-draw",
    "crates/ambre-sync",
    "crates/ambre-trame",
    "crates/ambre-prose",
    "crates/ambre-toile",
    "crates/ambre-murmure",
    "crates/ambre-app",
    "crates/ambre-logic-worker",
    "crates/ambre-sync-worker",
]

[workspace.dependencies]
# Common
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_bytes = "0.11"
hex = "0.4"
uuid = { version = "1.0", features = ["v7", "js"] }
postcard = { version = "1.0", features = ["alloc"] }
rustc-hash = "2.0"
thiserror = "2.0"
tracing      = "0.1"
tracing-wasm = "0.2"
cfg-if = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
async-trait = "0.1"

# Crypto
chacha20poly1305 = { version = "0.10" }
ed25519-dalek = { version = "2.0" }
x25519-dalek = { version = "2.0" }
blake2 = { version = "0.10" }
argon2 = { version = "0.5" }

# UI
taffy     = "0.10"
accesskit = "0.24"
smallvec  = { version = "1", features = ["union"] }
slotmap   = "1.0"
wgpu    = { version = "28.0", features = ["webgl"] }
parley  = "0.7"
kurbo   = "0.13"
peniko  = "0.6"
bytemuck = { version = "1", features = ["derive"] }
# Path tessellation (phase 1: fill_path / stroke_path)
lyon = "1"
# Glyph rasterization (phase 2: GlyphAtlas) -- match parley's transitive dep
swash = "0.2"

# WASM
gloo-net = { version = "0.7", features = ["http", "websocket"] }
web-sys = { version = "0.3.85", features = [
    "CanvasRenderingContext2d",
    "DedicatedWorkerGlobalScope",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "ImageData",
    "KeyboardEvent",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "Performance",
    "WebSocket",
    "Window",
    "Request",
    "Response",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
js-sys = "0.3.85"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

# Compression
ruzstd = "0.8"

# CRDT
loro = "1.10"

# Graph
petgraph = "0.8"
rstar = "0.12"

# Import/export
docx-rs = "0.4"
krilla = "0.7"
html5ever = "0.39"
pulldown-cmark = "0.13"


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package.ambre-app]
opt-level = "z" # size optimizations for WASM binaries

[profile.release.package.ambre-logic-worker]
opt-level = "z"

[profile.release.package.ambre-sync-worker]
opt-level = "z"
