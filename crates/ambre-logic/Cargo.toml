[package]
name = "ambre-logic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Logic thread — typed command dispatch, per-document state registry, viewport computation. Runs as a dedicated thread sharing the WASM heap."

[features]
# Document-fixture machinery (`ambre-spec-fixtures.md`). Non-default and
# host-only -- this crate ships to wasm, so the gate matters most here: the
# loader, `shape_of`, `canonical_dump` and the driver are all behind it, while
# `DocState::import_snapshot` / `export_snapshot` are ungated production code
# (`FIXTURE-007`). Every downstream feature is named explicitly: a Cargo feature never
# enables its dependency's feature implicitly.
# The deck's PDF export (`toile-pdf-export`, `TOILE-IO-029`). The render walk
# runs on this thread because the base font faces do: `LoadFonts` seeds
# `export_cx` here and nowhere else. Non-default -- it pulls the PDF serializer
# into the bundle, so a build that never exports does not pay for it.
toile-pdf = ["ambre-toile/pdf"]

fixtures = [
    "ambre-core/fixtures",
    "ambre-trame/fixtures",
    "ambre-toile/fixtures",
    "ambre-prose/fixtures",
    "dep:ambre-crypto",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
]

[dependencies]
ambre-bus       = { path = "../ambre-bus" }
# `DocType` / `Uuid`, the `.ambre` container error taxonomy
# (`ambre-spec-docfile.md`) and, under `fixtures`, the manifest types
# (`ambre-spec-fixtures.md`).
ambre-core      = { path = "../ambre-core" }
ambre-trame     = { path = "../ambre-trame" }
ambre-toile     = { path = "../ambre-toile" }
# The Prose engine: one `DocState` arm, like Trame and Toile
# (`features/ambre-spec-prose-engine.md`).
ambre-prose     = { path = "../ambre-prose" }

# Fixture-only, host-only. `ambre-crypto` supplies `hash::chain_hash` for
# the manifest digest; `serde_json` encodes the sidecar. `serde_json` is a
# workspace dependency but was not yet one of this crate's, which is the one new
# dependency edge `FIXTURES P0` carries.
ambre-crypto    = { path = "../ambre-crypto", optional = true }
# The committed benchmark baseline (`FIXTURE-023`) derives its own encoding, and
# the manifest types it sits beside already derive theirs in `ambre-core`. A
# workspace dependency everywhere else in the tree, and fixture-only here.
serde           = { workspace = true, optional = true }
serde_json      = { workspace = true, optional = true }
# The corpus error taxonomy (`FixtureError`), which wraps `DocFileError` rather
# than flattening it into a string.
thiserror       = { workspace = true, optional = true }
# The one-shot answers of the IndexedDB store, awaited on the main thread.
futures-channel = { workspace = true }

tracing       = { workspace = true }
futures-util  = { workspace = true }
# The PDF-export FontContext lives on this thread (`toile-pdf-export`), seeded
# by `LogicCommand::LoadFonts`. Only parley -- not the whole GPU canvas crate --
# so the Logic worker's wasm stays lean.
parley        = { workspace = true }
# The sealed font context (`PDF-007`): the export shapes on what `LoadFonts`
# delivered and on no face of the machine. Already in the graph through every
# application crate, so the edge adds no code to the worker.
ambre-draw    = { path = "../ambre-draw" }

wasm-bindgen        = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys              = { workspace = true }
web-sys             = { workspace = true, features = [
    "Event",
    "EventTarget",
    "DomStringList",
    "IdbDatabase",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbKeyRange",
    "Storage",
    "Window",
] }

[dev-dependencies]
# Host tests craft a tiny PNG to drive a real Toile media import through the
# dispatcher (service-plane routing, `toile-media`).
image = { workspace = true }
# The geometry the Toile commands of the dispatch belt carry
# (`ambre-spec-toile-schema.md`).
kurbo = { workspace = true }

# The scale benches (`ambre-spec-fixtures.md` section 3). Host-only: they read a
# git-ignored corpus off disk, which no wasm target has.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The corpus driver (`ambre-spec-fixtures.md` section 3), behind the same feature
# as the code it drives: `required-features` keeps it out of every other build,
# including the wasm one, so `FIXTURE-007` holds for the binary too.
[[bin]]
name = "ambre-fixtures"
path = "src/bin/ambre-fixtures.rs"
required-features = ["fixtures"]

# The scale benches (`ambre-spec-fixtures.md` section 3), behind the same feature
# as the corpus they read. No CI job runs them (`FIXTURE-023`).
[[bench]]
name = "scale"
harness = false
required-features = ["fixtures", "toile-pdf"]

[lints]
workspace = true
