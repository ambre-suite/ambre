<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ambre</title>

    <!--
        Trunk processes this file at build time.

        Two wasm artifacts:
          - ambre-app  : the Main instance (UI Thread + Logic thread sharing one
                         linear memory via wasm_thread).
          - ambre-sync : the Sync worker -- a SEPARATE wasm instance with its own
                         memory, run in a dedicated Web Worker and reached from
                         Main over postMessage (data-type="worker").

        wasm-opt is disabled: Trunk 0.21.13 ships Binaryen 116, which cannot
        parse the wasm instructions emitted by rustc nightly with `+atomics`
        (fails with `[parse exception: invalid code after misc prefix: 17]`).
        Re-enable once Trunk picks up Binaryen 117+, or wire a manual
        wasm-opt post-step with a newer binaryen.
    -->
    <link data-trunk rel="rust" data-wasm-opt="0" />

    <!-- Sync worker: a SEPARATE wasm-bindgen artifact. Trunk emits
         `ambre-sync_loader.js` (classic worker, `importScripts`); ambre-app
         spawns it via `new Worker("/ambre-sync_loader.js")`. The loader runs
         `wasm_bindgen(...)`, which creates the worker's own shared memory and
         invokes `#[wasm_bindgen(start)]`. -->
    <link data-trunk rel="rust" href="../ambre-sync/Cargo.toml" data-type="worker"
          data-loader-shim="true" data-wasm-opt="0" />

    <!-- App-shell layout styling. Colour/spacing/font tokens are injected at
         startup from the generated theme.css (tokens.ron -> build.rs). -->
    <link data-trunk rel="css" href="styles.css" />

    <!-- Font assets served at /fonts/ -- loaded at runtime via fetch(). -->
    <link data-trunk rel="copy-dir" href="fonts" />

    <!-- Image assets served at /assets/ (e.g. the About dialog backdrop). -->
    <link data-trunk rel="copy-dir" href="assets" />

    <style>
        /* Reset. The Leptos AppShell (ambre-chrome) owns the full-viewport
           grid; the wgpu canvas is a cell inside it. */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            /* Prevent pull-to-refresh and overscroll on mobile. */
            overscroll-behavior: none;
        }

        /* Loading screen -- visible until WASM signals readiness. */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #333;
            border-top-color: #7c6ef0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Fallback message if WebGL2 is unavailable (extremely rare). */
        #no-webgpu {
            display: none;
            position: fixed;
            inset: 0;
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 2rem;
            text-align: center;
            z-index: 20;
        }

        #no-webgpu h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        #no-webgpu p {
            max-width: 480px;
            margin: 0 auto 1rem;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <!-- Loading screen (hidden by WASM via window.ambreReady after GPU init). -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <!--
        The app shell and its <canvas> cell are created by the Leptos
        AppShell (ambre-chrome), mounted from lib.rs once WASM starts. The
        canvas backing store is sized to its grid cell in Rust
        (ambre-canvas::host), so no JS ResizeObserver is needed here.
    -->

    <!-- Fallback for browsers without WebGL2 (IE11 and below). -->
    <div id="no-webgpu">
        <h1>Unsupported browser</h1>
        <p>
            Ambre uses WebGL2 for rendering. Your browser does not appear to support it.
        </p>
        <p>
            Supported browsers: Chrome 56+, Firefox 51+, Safari 15+, Edge 79+.
        </p>
    </div>

    <script type="module">
        // Minimal JS bootstrap. Everything else is Rust/WASM:
        //   - lib.rs (wasm_bindgen start) mounts the Leptos AppShell, spawns the
        //     Logic/Sync workers, and runs the UI thread (wgpu init + rAF loop).
        //   - ambre-canvas::host sizes the canvas backing store to its grid cell.
        //
        // This only exposes the "ready" hook that hides the loading screen.
        window.ambreReady = function () {
            const loading = document.getElementById("loading");
            if (loading) {
                loading.classList.add("hidden");
                setTimeout(() => loading.remove(), 300);
            }
        };

        // Called by the Rust panic hook when the application suffers an
        // unrecoverable error. Displays a fatal error overlay over the canvas
        // because panic=abort tears down the WASM module without graceful UI.
        window.ambreFatal = function (message) {
            const canvas = document.getElementById("ambre-canvas");
            if (!canvas) return;
            const overlay = document.createElement("div");
            overlay.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg, Canvas);color:var(--error, CanvasText);font-family:monospace;font-size:var(--font-body);padding:var(--space-20);text-align:center;z-index:9999;";
            overlay.textContent = "Ambre encountered a fatal error and must reload.\n\n" + message;
            canvas.parentElement.appendChild(overlay);
        };
    </script>
</body>

</html>
