[package]
name = "ambre-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Widget framework and GPU rendering pipeline for Ambre UI Thread"

[dependencies]
ambre-draw = { path = "../ambre-draw" }

# Rendering
wgpu       = { workspace = true }
bytemuck   = { workspace = true }
swash      = { workspace = true }
parley     = { workspace = true }
rustc-hash = { workspace = true }

# Widget framework
taffy     = { workspace = true }
accesskit = { workspace = true }
smallvec  = { workspace = true }
slotmap   = { workspace = true }
kurbo     = { workspace = true }
peniko    = { workspace = true }

# UI Thread host plumbing (GPU bootstrap + rAF loop). wasm32-only: surface
# creation from a canvas and the web_sys glue don't exist on native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys              = { workspace = true }
js-sys               = { workspace = true }
wasm-bindgen         = { workspace = true }
wasm-bindgen-futures = { workspace = true }
tracing              = { workspace = true }
