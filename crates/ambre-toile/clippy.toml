# Every hash table of Toile goes through `ambre_core::hash`, which keys foldhash
# once per process from the platform entropy source (`TOILE-293`). On
# wasm32-unknown-unknown the std map keys SipHash from addresses, which wasm does
# not randomize, and SipHash costs more.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "use ambre_core::hash::HashMap: a peer chooses the element ids (TOILE-293)" },
    { path = "std::collections::HashSet", reason = "use ambre_core::hash::HashSet: a peer chooses the element ids (TOILE-293)" },
]

# The four lines of the root `clippy.toml`, which this file shadows: a test
# asserts by panicking, so the panic lints (`ARCH-028`) stop at its boundary.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
