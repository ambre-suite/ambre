[package]
name = "ambre-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sync worker — E2EE crypto, single multiplexed WebSocket, HTTP REST, compression. Its own wasm instance (a dedicated Web Worker), reached from Main via postMessage."

[lib]
# cdylib: the standalone Sync Web Worker wasm artifact (built by Trunk via the
# `#[wasm_bindgen(start)]` entry in `worker.rs`). rlib: so the crate's own
# integration tests (and host builds) can link `SyncState`.
crate-type = ["cdylib", "rlib"]

[features]
# The sealed open path, reachable from the fuzz targets in `fuzz/` (`ARCH-029`).
# Non-default and host-only: `ambre-app` never names it, so no client build
# carries the entry points it adds.
fuzz = []

[dependencies]
ambre-bus      = { path = "../ambre-bus" }
ambre-protocol = { path = "../ambre-protocol" }
ambre-core     = { path = "../ambre-core" }
# Crypto primitives + envelope. The wasm getrandom "js" backend is wired by
# ambre-crypto's own target-specific dependency, so nothing extra is needed here.
ambre-crypto   = { path = "../ambre-crypto" }

tracing  = { workspace = true }
serde    = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
# Session keypair types held in SyncState (derived from the MasterSeed).
ed25519-dalek = { workspace = true }
x25519-dalek  = { workspace = true }
# gloo-net → HTTP REST (fetch) + WebSocket
# ruzstd   → payload compression / decompression
gloo-net = { workspace = true, features = ["http", "websocket"] }
ruzstd   = { workspace = true }
hex      = { workspace = true }
# Each query value is percent-encoded whole (`SYNC-179`).
percent-encoding = { workspace = true }
base64   = { workspace = true }
getrandom = { workspace = true }

wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys      = { workspace = true, features = [
    "WebSocket", "BinaryType", "CloseEvent", "Event", "ErrorEvent",
    # Worker entry point (`worker.rs`): receive `SyncCommand`s and post
    # `LogicEvent`s back to the Main instance.
    "DedicatedWorkerGlobalScope", "MessageEvent", "WorkerLocation",
] }
futures-util = { workspace = true }

# Native-only: a current-thread executor to drive the sharing orchestration
# tasks (`invite_task` etc.) against a fake transport in unit tests.
[dev-dependencies]
# `Seq::nth` for a test that names a count. Test builds alone, held by
# `ambre-core/tests/testing_feature.rs` (`ARCH-055`).
ambre-core = { path = "../ambre-core", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt"] }
# The bound that proves a session token wipes on drop (`SYNC-100`). The code
# itself wipes through `ambre_core::Secret` alone (`ARCH-046`).
zeroize = { workspace = true }

# The key model of a call over generated joins, leaves and removals
# (`ambre-spec-call-media.md`). proptest pulls `wait-timeout`, which does not
# build on wasm32, so it is gated to the host target as ambre-murmure does.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }

# Sync worker bootstrap (wasm only): panic overlay + tracing into the console.
# This is a separate wasm instance from Main, so it inits its own subscriber.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
tracing-wasm = { workspace = true }

[lints]
workspace = true
