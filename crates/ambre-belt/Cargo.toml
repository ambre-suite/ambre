[package]
name = "ambre-belt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The browser-driven belt: the built application, served and driven through WebDriver (ambre-spec-testing.md section 4)."

[features]
# `browser` flips the `cfg_attr(not(feature = "browser"), ignore = ...)` gate
# off. It needs a Trunk build in `dist/` and a chromedriver
# (`just test-browser`). Pure marker feature -- it gates test attributes only.
browser = []
# `firefox` drives Firefox through geckodriver instead of Chrome
# (`just test-browser-firefox`). A test that pauses a worker through the
# DevTools Protocol, which Firefox does not speak, is ignored under it.
firefox = ["browser"]

[dependencies]
# Intentionally empty: the belt is tests only, and ships nothing.

[dev-dependencies]
# The call tests sign the admissions of the SFU in the place of the relay
# (`src/call.rs`), with a key drawn per run.
ambre-core        = { path = "../ambre-core" }
# The volume tests read the postcard tag of a command of the bus, to tell the roster tick of
# the Logic thread from a post a volume would make (`src/murmure.rs`).
ambre-bus         = { path = "../ambre-bus" }
postcard          = { workspace = true }
ambre-protocol    = { path = "../ambre-protocol" }
ed25519-dalek     = { workspace = true }
getrandom         = { workspace = true }
hex               = { workspace = true }
axum              = { workspace = true }
base64            = { workspace = true }
futures-util      = { workspace = true }
image             = { workspace = true, features = ["jpeg"] }
reqwest           = { workspace = true }
serde_json        = { workspace = true }
tokio             = { workspace = true }
tokio-tungstenite = "0.29"
# The proof host serves the page to a phone over TLS, which a secure context needs
# (`src/proof.rs`). The crate and its ring provider are those reqwest already links.
tokio-rustls      = { version = "0.26", default-features = false, features = ["ring"] }
uuid              = { workspace = true, features = ["v4"] }
# The identity provider the belt runs for the relay (`src/provider.rs`,
# `ambre-spec-call-proofs.md` section 2). Each crate is already in the tree
# through the relay: the provider crate, its RSA key and the clock of a claim.
openidconnect     = { workspace = true }
rsa               = { version = "0.9", features = ["getrandom"] }
chrono            = { workspace = true }

[lints]
workspace = true
