[package]
name = "ambre-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The converter modules: file formats in and out, one wasm instance per format family, fetched by the Logic thread on the first conversion of that family"

[lib]
# cdylib: a converter module, one wasm artifact per family, built apart from
# the Main instance by `scripts/converter_build.py` and fetched on the first
# conversion of its family. rlib: the Logic thread and the applications link
# the request types on every target, and the engines themselves on the host.
crate-type = ["cdylib", "rlib"]

[features]
# One feature per format family (`ambre_core::ConverterFamily`). A module
# build turns one on, the host turns every one on, and the Main instance none:
# it links the request types and the loader alone (`ARCH-078`).
tables = ["engine", "dep:csv"]
pdf = ["engine", "dep:ambre-pdf", "dep:tiny-skia-path", "dep:skrifa", "dep:flate2", "dep:kurbo", "dep:peniko"]
markup = ["engine", "dep:pulldown-cmark", "dep:html5ever"]
images = ["engine", "dep:usvg", "dep:roxmltree", "dep:image-webp", "dep:zune-jpeg", "dep:png", "dep:gif"]
office = ["engine", "dep:ambre-docx", "ambre-docx/codec", "dep:ambre-odt", "ambre-prose-form/word", "ambre-xlsx/codec", "ambre-pptx/codec", "dep:zune-jpeg"]
# boards: the Figma and Miro reader, over a JSON reader of the module's own.
boards = ["engine"]
# One spelling module per dictionary: the shared engine, and the dictionary
# the module embeds (`dictionaries/NOTICE.txt`).
spell_en = ["engine", "dep:spellbook"]
spell_fr = ["engine", "dep:spellbook"]
# Every family, linked in place: the host tier and the tests.
all-families = ["tables", "pdf", "markup", "images", "office", "boards", "spell_en", "spell_fr"]
# Set by each family: this build carries an engine and its exports.
engine = []
# The loader that instantiates the fetched module, on wasm. On in the Main
# instance alone: the module build leaves it off, so the module links no
# JavaScript binding it would export.
loader = ["dep:js-sys"]

[dependencies]
ambre-core = { path = "../ambre-core" }
ambre-client-core = { path = "../ambre-client-core" }
# The recorded draw list a PDF request carries (`ambre_draw::list`).
ambre-draw = { path = "../ambre-draw" }
# The role of Prose's intermediate form, which a DOCX request and its answer
# carry as bytes, in every build. The `office` family turns on the Word mapping
# over the form, in its module alone (`4-Prose/features/ambre-spec-prose-
# import-export.md section 3`).
ambre-prose-form = { path = "../ambre-prose-form" }
# The Excel model and its report, which an xlsx request and its answer
# carry as bytes, in every build. The `office` family turns on the codec, in
# its module alone (`2-Trame/features/ambre-spec-trame-import-export.md
# section 3`).
ambre-xlsx = { path = "../ambre-xlsx", default-features = false }
# The PowerPoint deck model, which a PPTX request and its answer carry, in
# every build. The `office` family turns on the writer and the reader, in
# its module alone (`3-Toile/features/ambre-spec-toile-pptx-export.md
# section 3`, `3-Toile/features/ambre-spec-toile-pptx-import.md section 3`).
ambre-pptx = { path = "../ambre-pptx" }
# office: the Word codec, with the package layer and its XML work.
ambre-docx = { path = "../ambre-docx", optional = true }
# office: the OpenDocument text codec, over the Word model and the shared
# OpenDocument package.
ambre-odt  = { path = "../ambre-odt", optional = true }
serde      = { workspace = true }
# A request and its answer cross into the module as postcard bytes.
postcard   = { workspace = true }
thiserror  = { workspace = true }

# The engines, each behind its family. Pure Rust.
# tables: the CSV reader and writer.
csv        = { workspace = true, optional = true }
# pdf: the PDF writer.
ambre-pdf  = { path = "../ambre-pdf", optional = true }
# pdf: the PNG writer of the same recorded draw list, which the converter
# thread runs: the stroker, the glyph outlines, the zlib stream and the
# geometry of the list, each the copy krilla links. The module rasterizes
# the paths and writes the PNG chunks itself (`3-Toile/features/ambre-spec-toile-import-
# export.md section 3`).
tiny-skia-path = { workspace = true, optional = true }
skrifa     = { workspace = true, optional = true }
flate2     = { workspace = true, optional = true }
kurbo      = { workspace = true, optional = true }
# pdf: the premultiplied sample the PNG raster blends, the type peniko,
# which `ambre-draw` links, names.
peniko     = { workspace = true, optional = true }
# markup: the Markdown parser, and the WHATWG tree builder of an HTML paste
# (`features/ambre-spec-prose-clipboard.md`).
pulldown-cmark = { workspace = true, optional = true }
html5ever  = { workspace = true, optional = true }
# images: the SVG reader, and the XML parser of its text pass. usvg drops its
# font stack (workspace manifest), so its tree carries no text.
usvg       = { workspace = true, optional = true }
roxmltree  = { workspace = true, optional = true }
# images: the WebP decoder, pure Rust (`image-webp`), the one the `image`
# crate's `webp` feature wraps. Called directly, without the 98 KB of brotli
# the `image` crate adds around it. Main's own `image` line keeps PNG and JPEG
# alone: a WebP picture reaches a board through this module.
image-webp = { workspace = true, optional = true }
# images: the JPEG decoder, pure Rust (`zune-jpeg`), the one the `image`
# crate's `jpeg` feature wraps. Called directly, as `image-webp` is: the scale
# and the turn are a few lines of this crate, and the `image` crate would add
# its whole frame to the module. Main links no JPEG decoder (`ARCH-078`), so a
# JPEG picture of Prose, Toile or Murmure decodes here, on the converter
# thread (`ambre-spec-architecture.md section 2`). No SIMD feature: the
# module builds for wasm32, and the default features add `unsafe` paths for
# x86 and NEON alone. The office family links it too: it decodes the
# thumbnail of each JPEG picture a PowerPoint file embeds, so Main decodes
# none (`3-Toile/features/ambre-spec-toile-pptx-import.md section 3`).
zune-jpeg  = { workspace = true, optional = true }
# images: the PNG and the GIF decoders, pure Rust, the ones the `image` crate
# wraps. Called directly, as `zune-jpeg` is. A PNG or a GIF picture of Prose
# and a Murmure preview decode here, on the converter thread, so neither holds
# the Logic thread (`ARCH-097`).
png        = { workspace = true, optional = true }
gif        = { workspace = true, optional = true }
# spell_en, spell_fr: the spell checker, a pure Rust reader of Hunspell
# dictionaries (MPL-2.0). Chosen over `zspell`, whose licence the registry
# does not state, and over a Hunspell binding, which fails the Rust-first
# pillar (`4-Prose/features/ambre-spec-prose-spell-check.md section 4`). Its
# default hasher is foldhash, which the workspace already links.
spellbook  = { version = "0.4.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The module's exports, and the loader the Logic thread instantiates it with.
wasm-bindgen = { workspace = true }
js-sys       = { workspace = true, optional = true }

# The HTML writer's inertness is a property over hostile text, on the host.
# proptest pulls `wait-timeout`, which does not build on wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }
# The JPEG fixtures are written by the encoder of the `image` crate at test
# time, never downloaded.
image    = { workspace = true, features = ["jpeg", "gif"] }
# The decode bench of the images module (`benches/decode.rs`).
criterion = { workspace = true }
# The Word documents the deadline bench reads and writes, built from the model.
ambre-docx = { path = "../ambre-docx" }
# The workbooks the deadline bench reads and writes, built from the model.
ambre-xlsx = { path = "../ambre-xlsx", features = ["codec"] }

# The loader's tests run in the browser (`just test-wasm`).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "decode"
harness = false
required-features = ["images"]

# The module calls that set the answer deadline of each converter family,
# held by a count of instructions (`scripts/instructions.py`).
[[bench]]
name = "instructions"
harness = false
required-features = ["images", "office", "markup", "tables"]

[lints]
workspace = true
