[workspace]
resolver = "2"
members = [
    "crates/ambre-core",
    "crates/ambre-commands",
    "crates/ambre-chrome",
    "crates/ambre-canvas",
    "crates/ambre-crypto",
    "crates/ambre-protocol",
    "crates/ambre-bus",
    "crates/ambre-draw",
    "crates/ambre-logic",
    "crates/ambre-sync",
    "crates/ambre-trame",
    "crates/ambre-prose",
    "crates/ambre-toile",
    "crates/ambre-murmure",
    "crates/ambre-app",
    "crates/ambre-server",
]
# Server excluded from default builds: it's a native target (tokio/mio)
# and would fail wasm32 compilations. Build it explicitly:
#   cargo check -p ambre-server
# or with the host target:
#   cargo check --target x86_64-unknown-linux-gnu
default-members = [
    "crates/ambre-core",
    "crates/ambre-commands",
    "crates/ambre-chrome",
    "crates/ambre-canvas",
    "crates/ambre-crypto",
    "crates/ambre-protocol",
    "crates/ambre-bus",
    "crates/ambre-draw",
    "crates/ambre-logic",
    "crates/ambre-sync",
    "crates/ambre-trame",
    "crates/ambre-prose",
    "crates/ambre-toile",
    "crates/ambre-murmure",
    "crates/ambre-app",
]

[workspace.dependencies]
# Common
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_bytes = "0.11"
hex = "0.4"
uuid = { version = "1.0", features = ["v7", "js"] }
postcard = { version = "1.0", features = ["alloc"] }
rustc-hash = "2.0"
thiserror = "2.0"
# CSV import/export for Trame interop (pure Rust, WASM-compatible, RFC 4180).
csv = "1.3"
tracing      = "0.1"
tracing-wasm = "0.2"
cfg-if = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
async-trait = "0.1"

# Crypto
chacha20poly1305 = { version = "0.10" }
ed25519-dalek = { version = "2.0" }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
blake2 = { version = "0.10" }
argon2 = { version = "0.5" }
hkdf = { version = "0.12" }
hmac = { version = "0.12" }
sha2 = { version = "0.10" }
# CSPRNG for nonces and key material. `wasm_js` selects the browser entropy
# backend (crypto.getRandomValues) on wasm32-unknown-unknown.
getrandom = { version = "0.3", features = ["wasm_js"] }

# Test-only
proptest = "1"
criterion = { version = "0.5", default-features = false }

# UI
# Chrome DOM framework (client-side rendering only). `csr` selects the
# browser-target reactive runtime; default features (ssr/hydrate plumbing) are
# off to keep the WASM bundle lean and avoid server-only deps.
leptos    = { version = "0.8", default-features = false, features = ["csr"] }
# Client-side router (pushState navigation, no full page load). CSR: no SSR
# features, matching the pure-client leptos build.
leptos_router = { version = "0.8", default-features = false }
# Tree-shaken SVG icons: only the `icondata` constants we reference are
# embedded in the WASM bundle (one <Icon icon=.../> -> one inlined <svg>).
leptos_icons = { version = "0.7" }
icondata     = { version = "0.7" }
wgpu    = { version = "28.0", features = ["webgl"] }
parley  = "0.7"
kurbo   = "0.13"
peniko  = "0.6"
bytemuck = { version = "1", features = ["derive"] }
# Path tessellation (phase 1: fill_path / stroke_path)
lyon = "1"
# Glyph rasterization (phase 2: GlyphAtlas) -- match parley's transitive dep
swash = "0.2"

# WASM
gloo-net = { version = "0.7", features = ["http", "websocket"] }
web-sys = { version = "0.3.85", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "DataTransfer",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlDialogElement",
    "HtmlDocument",
    "HtmlElement",
    "HtmlTextAreaElement",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "Node",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "DedicatedWorkerGlobalScope",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "Performance",
    "PointerEvent",
    "Request",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Response",
    "WebSocket",
    "WheelEvent",
    "Window",
    "UrlSearchParams",
] }
js-sys = "0.3.85"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
# Multi-threaded WASM — std::thread replacement that spawns Web Workers under
# the hood. Required for the shared-linear-memory threading model documented
# in specs/ambre-multithreaded-wasm-migration.md.
wasm_thread = "0.3"
# Inter-thread channels for the shared-memory UI <-> Logic link (both in the
# Main wasm instance). Logic blocks on `flume::Selector` (Atomics-backed, works
# across the UI/Logic worker boundary); the UI polls `try_recv` per frame. The
# Logic <-> Sync link is NOT a channel anymore -- Sync is a separate wasm worker
# reached via `postMessage`, so flume's async-waker limitation no longer applies.
# `async` => `recv_async` (Sync worker select loop + IndexedDB oneshots);
# `select` => `Selector` (Logic blocks on UI + Sync at once). `eventual-fairness`
# (default) is dropped: it pulls `nanorand`, unneeded for our usage.
flume = { version = "0.11", default-features = false, features = ["async", "select"] }

# Compression
ruzstd = "0.8"

# CRDT
loro = "1.10"

# Formula parsing
nom = "8.0"

# Graph
petgraph = "0.8"
rstar = "0.12"

# Server (native target, not wasm32)
tokio             = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum              = { version = "0.8", features = ["ws"] }
axum-extra        = { version = "0.10", features = ["cookie"] }
tower             = "0.5"
tower-http        = { version = "0.6", features = ["cors", "trace"] }
futures-util      = "0.3"
sqlx              = { version = "0.8", features = ["postgres", "uuid", "chrono", "runtime-tokio-rustls"] }
rustis            = "0.19.3"
aws-sdk-s3        = { version = "1.128", features = ["behavior-version-latest"] }
chrono            = { version = "0.4", features = ["serde"] }
base64            = "0.22"
time              = "0.3"
openidconnect     = "4"
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url               = "2"
sharks            = "0.2"
jsonwebtoken      = "9"

# Import/export
docx-rs = "0.4"
krilla = "0.7"
html5ever = "0.39"
pulldown-cmark = "0.13"


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package.ambre-app]
opt-level = "z" # size optimization for the WASM binary
