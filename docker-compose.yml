services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ambre
      POSTGRES_PASSWORD: ambre
      POSTGRES_DB: ambre_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambre -d ambre_dev"]
      interval: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # The S3 object store. The image holds the binary alone, no shell, so
  # `scripts/garage_init.sh` creates the layout, the key and the bucket from
  # the host (`just services-up` runs it).
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: ambre-garage
    ports:
      - "9000:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ambre.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  garagemeta:
  garagedata:
  pgadmindata:
