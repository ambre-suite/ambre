# Each image names one exact version and the digest of its multi-arch index,
# and the `services:` of `.github/workflows/ci.yml` name the same images.
# `just service-pins` holds both (`ARCH-087`, `ARCH-088`). A bump moves the
# version and the digest together, in both files.

services:
  postgres:
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: ambre-postgres
    environment:
      POSTGRES_USER: ambre
      POSTGRES_PASSWORD: ambre
      POSTGRES_DB: ambre_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambre -d ambre_dev"]
      interval: 5s
      retries: 5

  redis:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    container_name: ambre-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # A cluster of three primaries, for the db tier run against a cluster
  # (`SRV-252` to `SRV-255`). The nodes share the host network, so each one
  # announces an address the tests on the host reach. `just cluster-up` starts
  # them and joins them; the profile keeps them out of `docker compose up`.
  redis-cluster-1:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    container_name: ambre-redis-cluster-1
    profiles: ["cluster"]
    network_mode: host
    command: ["redis-server", "--port", "7001", "--cluster-enabled", "yes", "--cluster-config-file", "nodes-7001.conf", "--cluster-announce-ip", "127.0.0.1", "--save", "", "--appendonly", "no"]

  redis-cluster-2:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    container_name: ambre-redis-cluster-2
    profiles: ["cluster"]
    network_mode: host
    command: ["redis-server", "--port", "7002", "--cluster-enabled", "yes", "--cluster-config-file", "nodes-7002.conf", "--cluster-announce-ip", "127.0.0.1", "--save", "", "--appendonly", "no"]

  redis-cluster-3:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    container_name: ambre-redis-cluster-3
    profiles: ["cluster"]
    network_mode: host
    command: ["redis-server", "--port", "7003", "--cluster-enabled", "yes", "--cluster-config-file", "nodes-7003.conf", "--cluster-announce-ip", "127.0.0.1", "--save", "", "--appendonly", "no"]

  # The S3 object store. `scripts/garage_init.py` creates the layout, the key
  # and the bucket through the admin API on port 3903 (`just services-up` runs
  # it), so the init needs no shell in the image, which has none.
  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    container_name: ambre-garage
    ports:
      - "9000:3900"
      - "3903:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.19.0@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    container_name: ambre-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ambre.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  garagemeta:
  garagedata:
  pgadmindata:
