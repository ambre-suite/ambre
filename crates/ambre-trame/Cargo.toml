[package]
name = "ambre-trame"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Trame (spreadsheet) application -- IPC types, logic controller, and UI renderer"

[features]
# Document-fixture machinery (`ambre-spec-fixtures.md`, `FIXTURE-007`). Non-default and
# host-only. Explicitly forwards `ambre-core/fixtures`: a Cargo feature never
# enables its dependency's feature implicitly, and the gated code names
# `ambre_core::FixtureShape`.
fixtures = ["ambre-core/fixtures"]

[dependencies]
tracing  = { workspace = true }

# Logic side (Logic thread): TrameState, CRDT / formula engine.
ambre-bus = { path = "../ambre-bus" }
# `DocType` / `Uuid` and the shared `.ambre` container header (`DOCFILE-007`):
# Trame supplies the payload, never its own header variant.
ambre-core = { path = "../ambre-core" }
# The command registry (`ambre-spec-commands.md`, UI-THREAD-019). Named directly
# rather than through `ambre-chrome`, which is wasm-only: the descriptions and
# the context-menu layouts are pure data, so they compile and test on the host
# like `ambre-toile`'s. The leaf carries no dependency of its own.
ambre-commands = { path = "../ambre-commands" }
loro      = { workspace = true }
# The workspace hash. A line a write past the used range adds takes a uid
# derived by BLAKE2b from the line before it, so two peers writing at once in
# one new line derive one line (`ambre-spec-trame-rows-and-columns.md`
# section 3). Pure Rust, already in the lock through `ambre-crypto`.
blake2    = { workspace = true }
# The map handles typed by the schema keys.
ambre-crdt = { path = "../ambre-crdt" }
petgraph  = { workspace = true }
nom       = { workspace = true }
# CSV import/export (`trame-import-export`): the request types and the loader
# of the converter module, which reads and writes the bytes. The Main instance
# links no CSV reader (`ARCH-078`).
ambre-convert = { path = "../ambre-convert" }
# One atomic per-cell style record (`cellstyle_{sheet}`): serde-derived
# `CellStyle` postcard-encoded into a single CRDT binary register, so concurrent
# whole-cell restyles race once instead of once per style container.
serde     = { workspace = true }
postcard  = { workspace = true }
# The refusals of the message vocabulary (`message`) derive `thiserror::Error`.
thiserror = { workspace = true }

# UI side (UI Thread): DrawSurface renderer, text layout, frame channels.
ambre-draw = { path = "../ambre-draw" }
# 2D path parsing/flattening: scanline-fill the MdiFilter glyph on the canvas
# autofilter buttons (the GPU surface has no fill_path). Host + wasm.
kurbo      = { workspace = true }
ambre-canvas   = { path = "../ambre-canvas" }
web-sys    = { workspace = true }
wasm-bindgen = { workspace = true }

# Trame-specific chrome (the `chrome` module): the format toolbar, selection
# toolbar, command wiring. Wasm-only -- leptos CSR + DOM, like ambre-chrome --
# so it is scoped to the wasm32 target and never compiled into host logic tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ambre-chrome = { path = "../ambre-chrome" }
leptos       = { workspace = true }
# Tree-shaken SVG icons for the borders popover (BsBorder* set).
leptos_icons = { workspace = true }
icondata     = { workspace = true }
# Current wall-clock time for TODAY()/NOW() (std::time is unavailable on
# wasm32-unknown-unknown).
js-sys       = { workspace = true }

[dev-dependencies]
# Headless render tests: RecordingSurface mock DrawSurface + FixedClock.
ambre-draw = { path = "../ambre-draw", features = ["testing"] }
# `Seq::nth` for a test that names a count. Test builds alone, held by
# `ambre-core/tests/testing_feature.rs` (`ARCH-055`).
ambre-core = { path = "../ambre-core", features = ["testing"] }
# A count of decimal places keeps its bare JSON number (`message`).
serde_json = { workspace = true }

# `proptest` pulls `wait-timeout`, which does not compile on
# `wasm32-unknown-unknown`; gating it to the host target keeps the wasm tier
# (`just test-wasm`, the chrome tests below) building. The CRDT convergence
# property tests that use it are host-only anyway (Epic `ET`,
# `ambre-spec-testing.md`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }
# The CSV tests convert through the engine linked in place, as the Logic
# thread's host build does (`ambre_convert::Converter`).
ambre-convert = { path = "../ambre-convert", features = ["tables", "pdf"] }
# Reads the characters back out of a written page (`PDF-005`).
pdf-extract = "0.12"

# Leptos UI tests (Epic `ET`, `ambre-spec-testing.md`): the chrome is
# `cfg(target_arch = "wasm32")` (leptos CSR + DOM), so its tests run under the
# wasm target in headless Chrome (`just test-wasm`). The integration test names
# the chrome's public types directly (ambre-bus events, the leptos signals,
# ambre-chrome stores, the perf snapshot): the runtime tables above already
# declare those four crates for the wasm target, so no line here repeats them.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# Awaits a browser task, such as the `close` event a dialog queues.
wasm-bindgen-futures = { workspace = true }

# Guards the walk of the "Trame structural edit" row by a count of instructions under
# callgrind, which `scripts/instructions.py` reads (`just instructions`).
[[bench]]
name = "instructions"
harness = false

[lints]
workspace = true
