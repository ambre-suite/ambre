[package]
name = "ambre-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sync thread — E2EE crypto, single multiplexed WebSocket, HTTP REST, compression. Runs as a dedicated thread sharing the WASM heap."

[dependencies]
ambre-bus      = { path = "../ambre-bus" }
ambre-protocol = { path = "../ambre-protocol" }
# ambre-crypto will be added when the crypto pipeline is wired (see open
# question in specs/ambre-multithreaded-wasm-migration.md). It pulls in
# getrandom without the "js" feature, which still needs WASM-specific feature
# resolution.

flume   = { workspace = true }
tracing = { workspace = true }
# Forward-looking placeholders for the not-yet-wired crypto/network pipeline:
#   zeroize  → wipe DocumentKey / MasterSeed on Logout
#   gloo-net → HTTP REST (fetch) + WebSocket
#   ruzstd   → payload decompression
zeroize  = { workspace = true }
gloo-net = { workspace = true, features = ["http", "websocket"] }
ruzstd   = { workspace = true }

wasm-bindgen = { workspace = true }
web-sys      = { workspace = true, features = ["WebSocket", "BinaryType", "CloseEvent"] }
