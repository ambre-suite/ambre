# cargo-mutants configuration (`just mutants`, the CI `mutants` job).
#
# The host tier only: a wasm or browser test costs a `-Z build-std` build or a
# Chrome start per mutant, which no budget holds.
#
# The scope is the boundary a surviving mutant would break in silence: the
# Sync worker (the zero-knowledge and ordering boundary), the cryptography,
# and the Murmure channel model. Each exclusion below states its reason.

examine_globs = [
    "crates/ambre-sync/src/**/*.rs",
    "crates/ambre-crypto/src/**/*.rs",
    "crates/ambre-murmure/src/channel.rs",
    "crates/ambre-murmure/src/channel/**/*.rs",
]

exclude_globs = [
    # Test doubles: a mutant there changes the harness, not the product.
    "crates/ambre-sync/src/mock.rs",
    "crates/ambre-sync/src/mock_relay.rs",
    # Behind the `fuzz` feature, which no host test build enables.
    "crates/ambre-sync/src/fuzz.rs",
    # Compiled for wasm32 alone: no host test can build a mutant of it.
    "crates/ambre-sync/src/worker.rs",
]

# Doctests are left out: each one is a separate compile per mutant, and the
# files in scope hold none.
additional_cargo_test_args = ["--lib", "--tests"]

# Each line names one mutant by the name cargo-mutants prints, with its reason.
exclude_re = [
    # The clamp moves a PeerID of `u64::MAX` to the value below. It fires on a
    # BLAKE2b output of `u64::MAX` alone: no test can find that preimage.
    'peer\.rs:.*replace - with / in derive_peer_id',
    # Equivalent: on an empty body, the mutant unmarks or deletes the empty
    # range, which Loro takes as no operation.
    "replace > with >= in ChannelState::edit",
    "replace > with >= in ChannelState::delete",
    "replace > with >= in fold_into",
    # Cost only: the byte probe spaces its snapshot exports. Each mutant moves
    # when the next export runs, and the close still fires at the first export
    # past the bound.
    "replace < with == in ChannelState::passes_bytes",
    'replace / with \* in ChannelState::passes_bytes',
    "replace / with % in ChannelState::passes_bytes",
    # Equivalent: Loro reads a counter of 0 in a version vector as an absent
    # peer, so keeping a peer at 0 forks at the same version.
    "replace > with >= in ChannelState::relayed_amendments",
    # Equivalent: each mutant also writes a counter equal to the one held,
    # which changes no version vector.
    'relocating\.rs:9[0-9]:.*replace > with >= in ChannelState::relocate_locked',
    'relocating\.rs:10[0-9]:.*replace > with >= in ChannelState::relocate_locked',
    # Unobservable from safe code: the mutant drops a frame unwiped, and no
    # host test can read freed memory. `ambre_core::Secret` holds the wipe.
    'replace UpdateFrame::wipe with \(\)',
    # Equivalent: at ten keys, truncating the cache to ten removes nothing.
    "replace > with >= in SyncDocumentState::rotate_key",
    # Host-unreachable: the socket handle exists in the browser alone, so no
    # host build reaches the send, and the wasm entry is compiled for wasm32
    # alone. The browser tier holds both.
    'replace SyncState::send_wire with \(\)',
    'replace run_wasm with \(\)',
    'in SyncState::wire_ws_callbacks',
    # Host-unreachable: each mutant sits in the `spawn_local` task of the
    # browser path, which only a socket handle reaches.
    'match guard resp\.setup_owed\(\) with (true|false) in SyncState::handle_unlock',
    'delete ! in SyncState::handle_provider_return',
    # Equivalent: placeholders until their flows land. Each argument drops,
    # and zeroizes, at the end of the call either way.
    'replace SyncState::handle_change_passphrase with \(\)',
    'replace SyncState::handle_recover_account with \(\)',
    # Equivalent on the host: with no relay the rename only logs. The request
    # leaves from the browser path alone.
    'replace SyncState::handle_name_channel with \(\)',
    # Equivalent on the host: with no relay each of these only logs. The
    # read cursors, the activity and the space listing leave from the
    # browser path alone, and the browser tier holds them.
    'replace SyncState::(handle_mark_read|handle_move_read_cursors|handle_mark_thread_read|move_cursors|handle_mark_all_read|handle_fetch_activity|fetch_activity|handle_list_space_channels) with \(\)',
    'replace put_cursors with \(\)',
    'delete ! in SyncState::handle_mark_read',
    'replace == with != in SyncState::fetch_activity',
    'delete match arm .* in SyncState::handle_list_documents',
    # Cost only, and in the browser path: the mutant fetches the key links
    # of a name sealed under the current key too, which opens it the same.
    "replace == with != in ListedName<'_>::open",
    # The browser transport: host tests drive a scripted transport in its
    # place, and the browser tier drives this one.
    '<impl MediaHttp for GlooHttp>',
    '<impl ShareHttp for GlooHttp>',
    '<impl Transport for Fetch>',
    # The renewal and the revoke over `Fetch`: their `_via` twins hold the
    # logic, and host tests drive those through the scripted transport.
    'replace AuthContext::(refresh|revoke) -> Result<\(\), HttpError> with Ok\(\(\)\)',
    # The request helpers bound to `Fetch`: each hands its request to a
    # `_via` twin, or to `exchange`, that host tests drive in its place.
    'http\.rs:.*replace (get_json_opt_auth|download_snapshot|delete_auth|put_sealed|patch_json_auth|delete_json_auth|put_json_auth|post_json_auth_ok|fetch_bytes|fetch_key_links) -> ',
    'Method::gloo',
]
