[package]
name = "ambre-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI Thread WASM — Vello/Masonry rendering, rAF loop, input capture, Worker bootstrap"

[lib]
crate-type = ["cdylib"]

[dependencies]
ambre-bus          = { path = "../ambre-bus" }
ambre-core         = { path = "../ambre-core" }
ambre-logic-worker = { path = "../ambre-logic-worker" }
ambre-sync-worker  = { path = "../ambre-sync-worker" }

serde    = { workspace = true }
postcard = { workspace = true }
log      = { workspace = true }
cfg-if   = { workspace = true }

# UI rendering (Vello, Masonry, wgpu, winit)
vello   = { workspace = true }
masonry = { workspace = true }
wgpu    = { workspace = true }
winit   = { workspace = true }

# Web APIs
web-sys = { workspace = true, features = ["WorkerOptions", "WorkerType"] }
js-sys  = { workspace = true }
wasm-bindgen = { workspace = true }

console_log              = { workspace = true }
console_error_panic_hook = { workspace = true }
