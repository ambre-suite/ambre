[package]
name = "ambre-logic-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Logic Worker WASM — CRDT dispatch, AppController registry, viewport computation"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enables the #[wasm_bindgen(start)] shim for standalone builds (release pipeline).
# Not set when ambre-app depends on this crate as a library (dev unified build).
standalone = []

[dependencies]
ambre-bus   = { path = "../ambre-bus" }
ambre-core  = { path = "../ambre-core" }
ambre-trame = { path = "../ambre-trame" }

# App logic deps (heavy -- must not appear in ambre-trame or ambre-app)
loro     = { workspace = true }
petgraph = { workspace = true }

serde    = { workspace = true }
postcard = { workspace = true }
tracing      = { workspace = true }
tracing-wasm = { workspace = true }

wasm-bindgen             = { workspace = true }
js-sys                   = { workspace = true }
web-sys                  = { workspace = true }
console_error_panic_hook = { workspace = true }
