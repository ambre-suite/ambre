# Dependabot moves the actions of `.github/workflows/`, each pinned by a full
# commit SHA with its tag in a comment. Cargo dependencies stay out: a bump
# there passes `just deny` and the capability bans of `deny.toml` by review.
#
# One group holds every action bump, majors included, so a week yields one
# pull request and one CI run over `ci.yml` rather than one per action, each
# conflicting with the next on the same file. A bump that breaks CI is split
# out by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
