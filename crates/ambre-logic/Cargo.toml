[package]
name = "ambre-logic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Logic thread — typed command dispatch, per-document state registry, viewport computation. Runs as a dedicated thread sharing the WASM heap."

[dependencies]
ambre-bus       = { path = "../ambre-bus" }
ambre-trame     = { path = "../ambre-trame" }
ambre-toile     = { path = "../ambre-toile" }
# UI <-> Logic channels in shared memory. Logic blocks on `flume::Selector`
# (Atomics-backed, works across the UI/Logic worker boundary).
flume           = { workspace = true }

tracing       = { workspace = true }
futures-util  = { workspace = true }
# The PDF-export FontContext lives on this thread (`toile-interop §3.A`), seeded
# by `LogicCommand::LoadFonts`. Only parley -- not the whole GPU canvas crate --
# so the Logic worker's wasm stays lean.
parley        = { workspace = true }

wasm-bindgen        = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys              = { workspace = true }
web-sys             = { workspace = true, features = [
    "Event",
    "EventTarget",
    "DomStringList",
    "IdbDatabase",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbKeyRange",
    "Storage",
    "Window",
] }

[dev-dependencies]
# Host tests craft a tiny PNG to drive a real Toile media import through the
# dispatcher (service-plane routing, `toile-interop §5`).
image = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
