[package]
name = "ambre-toile"
version = "0.1.0"
edition = "2024"
description = "Whiteboard & presentations application for Ambre — infinite canvas, embedded documents"

[dependencies]
ambre-core = { path = "../ambre-core" }
ambre-bus = { path = "../ambre-bus" }
ambre-draw = { path = "../ambre-draw" }
# Command registry (`CommandId`): the context-menu command surface (toile-ui
# §5ter) is pure and host-tested in `ui::menu`, so this is a host dependency, not
# wasm-only like the Leptos chrome that renders it.
ambre-commands = { path = "../ambre-commands" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# CRDT
loro = { workspace = true }

# Spatial indexing
rstar = { workspace = true }

# 2D geometry: connector routing, stroke smoothing, viewport / bounds math.
# Re-exported by ambre-draw, but named here directly for the Logic-thread engine.
kurbo = { workspace = true }

# 2D polygon boolean ops (union / subtract / intersect / exclude, toile-features
# §3). kurbo has no path-vs-path booleans, so shapes are flattened to polygon
# contours and combined here. Pure Rust, WASM-friendly.
i_overlay = { workspace = true }

# Compact serialization of the per-element ElementStyle LWW register (§2.E) and
# the clipboard payload -- consistent with the inter-thread IPC protocol.
postcard = { workspace = true }

# UI side (UI Thread): the DrawSurface renderer, GPU runtime, frame channels.
# The heavy render crates (wgpu/lyon/parley/swash) are linked once in
# ambre-canvas and shared; the view only paints through WgpuSurface (toile-ui §1).
ambre-canvas = { path = "../ambre-canvas" }
# UI Thread <-> Logic frame channels (shared memory, Main instance).
flume = { workspace = true }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }

# Toile-specific chrome (the tool palette / panels) is wasm-only Leptos, like
# ambre-trame's chrome; scoped to wasm32 so host logic/render tests never build it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ambre-chrome = { path = "../ambre-chrome" }
leptos = { workspace = true }
# Context-menu entry icons (toile-ui §5ter): every entry glyph comes from
# `icondata`, rendered through `leptos-icons` inside `ambre-chrome::ContextMenu`.
leptos_icons = { workspace = true }
icondata = { workspace = true }

[dev-dependencies]
# Headless render tests: RecordingSurface mock DrawSurface + FixedClock.
ambre-draw = { path = "../ambre-draw", features = ["testing"] }

# DOM tests for the Toile chrome (Epic `ET`, `ambre-spec-architecture.md` §4
# "wasm" tier): leptos CSR + real `document`, run via
# `wasm-pack test --headless --chrome crates/ambre-toile` (`just test-wasm`).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }

# Index-equivalence and 2-peer CRDT convergence property tests (§10, DoD).
# proptest pulls `wait-timeout`, which does not build on wasm32; the engine is
# host-testable, so gate it to the host target like ambre-trame does.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }
