[package]
name = "ambre-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI Thread entry point: creates the inter-thread channels, spawns the Logic/Sync threads, and drives an ambre_canvas::FrameHost over the app's DocView."

[lib]
crate-type = ["cdylib"]

[dependencies]
ambre-bus    = { path = "../ambre-bus" }
ambre-canvas = { path = "../ambre-canvas" }
ambre-chrome = { path = "../ambre-chrome" }
ambre-trame  = { path = "../ambre-trame" }
ambre-logic  = { path = "../ambre-logic" }
# NB: no dependency on ambre-sync -- the Sync worker is a SEPARATE wasm artifact
# (its own instance/memory), reached over postMessage, not linked as a crate.

leptos       = { workspace = true }
leptos_router = { workspace = true }
leptos_icons = { workspace = true }
icondata     = { workspace = true }
tracing      = { workspace = true }
tracing-wasm = { workspace = true }

# UI <-> Logic channels (shared memory, this Main instance).
flume        = { workspace = true }
# Encode SyncCommand / decode LogicEvent across the Sync-worker postMessage hop.
postcard     = { workspace = true }

# Entry point + Logic thread spawning (shared memory). The Sync worker is spawned
# directly via web_sys::Worker (separate instance), not through wasm_thread.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm_thread  = { workspace = true }
# Command keybinding listener (keydown on document).
web-sys      = { workspace = true }
js-sys = { workspace = true }

console_error_panic_hook = { workspace = true }
