# cargo-deny -- the supply chain and least-privilege wall.
#
# Run locally with `just deny`; CI runs the same recipe (`.github/workflows/ci.yml`).
#
# Two jobs here, and the second is the one that is specific to Ambre:
#
#  1. Advisories, licences and sources -- the usual supply-chain hygiene for a
#     dependency tree that ships cryptography.
#  2. **Capability bans.** Zero-knowledge is a property of *what each process can
#     do*, not only of what it does. A crate that can decrypt, derive a shared
#     secret or reconstruct a split secret must exist in exactly the components
#     that are supposed to hold that power. `wrappers` lists the crates allowed
#     to depend on each one; any new direct dependant fails the check, so
#     re-granting a capability becomes a deliberate, reviewable edit of this file
#     instead of one silent line in a `Cargo.toml`.
#
# Invariants mechanised here: `ZK-002`, `ZK-003`, `ZK-004`, `ZK-041`, `SRV-012`, `SYNC-011`,
# `ARCH-020`, `ARCH-071` (`ambre-spec-zero-knowledge.md`, `ambre-spec-server.md`,
# `ambre-spec-sync.md`, `ambre-spec-architecture.md`).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
version = 2
# Only crates the workspace itself depends on directly are worth an
# "unmaintained" verdict; a transitive one (loro's `im`/`bitmaps`, tooling's
# `paste`) is that upstream's decision, not a signal we can act on.
unmaintained = "workspace"
# Each entry names why it is accepted and what would close it. An empty
# justification is how an ignore list turns into a blindfold.
ignore = [
    # rsa <- openidconnect. Timing side channel on RSA *private key* operations;
    # the server only verifies OIDC id_token signatures with the provider's
    # public key, and holds no RSA private key. No fixed version exists upstream.
    # Closes when `openidconnect` drops the `rsa` crate or upstream ships a fix.
    "RUSTSEC-2023-0071",
    # chrono, unmaintained (2026-11-17). No CVE: the advisory warns of no
    # fixes to come. ambre-server names it for its timestamps, and sqlx,
    # oauth2 and openidconnect pull it in too, so a swap to `time` or `jiff`
    # in the server alone leaves it in the graph. Closes when the server and
    # those three crates move off it.
    "RUSTSEC-2026-0543",
    # Nothing else. The h2 0.3 / rustls-webpki 0.101 advisories that the legacy
    # AWS client stack used to drag in were fixed rather than ignored: the SDK's
    # default `rustls` feature is off (root `Cargo.toml`), leaving only the
    # modern hyper 1 / rustls 0.23 client.
]

[licenses]
version = 2
allow = [
    # Ambre's own crates. `AGPL-3.0` alone is deprecated in SPDX and parses as
    # an error, which says nothing about whether a later version applies; this
    # workspace grants only version 3.
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # `webpki-roots`: the Mozilla CA root store, shipped as data under a
    # permissive data licence, not code.
    "CDLA-Permissive-2.0",
]
# Nothing else. An allowance no crate matches is not free: it pre-approves a
# licence the tree does not carry, so the day one arrives no one reviews it.
# `Apache-2.0 WITH LLVM-exception` and `OpenSSL` were two of those, and adding
# either back is one line here plus the reason it returned.

[bans]
# A workspace this size resolves duplicate minor versions across transitive
# trees; that is noise, not a defect. Capability bans below are the point.
multiple-versions = "allow"
# The wildcard check exists for crates published to crates.io; every crate here
# is a workspace path dependency and none is published, so `*` requirements are
# the normal shape rather than a risk. (`allow-wildcard-paths` does not help:
# cargo-deny only applies it to crates marked `publish = false`.)
wildcards = "allow"

# AEAD. Sealing and opening document payloads happens in one place: the Sync
# worker, through `ambre-crypto`. The relay must never link it (`ZK-004`).
[[bans.deny]]
name = "chacha20poly1305"
wrappers = ["ambre-crypto", "dimpl"]

# Passphrase KDF. Argon2 runs client-side only (`ZK-003`); the server deriving a
# key from a passphrase would mean the passphrase reached it.
[[bans.deny]]
name = "argon2"
wrappers = ["ambre-crypto"]

# X25519 key agreement. `ambre-sync` needs it for the sharing handshake; the
# relay does not (`ZK-004`).
[[bans.deny]]
name = "x25519-dalek"
wrappers = ["ambre-crypto", "ambre-sync", "dimpl"]

# Ed25519. The one crypto operation the server is allowed: signature
# verification, plus minting its own access tokens (`SRV-012`). The SFU verifies
# the relay's signature of a call admission, and signs nothing. The belt, tests
# alone, signs admissions in the place of the relay.
# `openidconnect` is listed because a third-party parent is not a capability we
# grant; the point of this entry is to catch one of *our* crates taking the
# dependency directly.
[[bans.deny]]
name = "ed25519-dalek"
wrappers = [
    "ambre-crypto",
    "ambre-sync",
    "ambre-server",
    "ambre-sfu",
    "ambre-belt",
    "openidconnect",
]

# The DTLS of a call's hop. dimpl seals the transport between a browser and the
# SFU with the two primitives above, and opens no chunk: those are sealed end to
# end inside the hop (`CALL-012`). Only str0m reaches dimpl, and only the SFU
# reaches str0m, so the relay still links neither primitive (`ZK-004`).
[[bans.deny]]
name = "dimpl"
wrappers = ["str0m", "str0m-proto", "str0m-rust-crypto"]

[[bans.deny]]
name = "str0m"
wrappers = ["ambre-sfu"]
# The metrics of the two server processes. No client crate names a metric
# (`SRV-257`, `CALL-101`).
[[bans.deny]]
name = "ambre-metrics"
wrappers = ["ambre-server", "ambre-sfu"]

# The client crypto crate itself. `ambre-logic` is listed for its fixtures-only,
# host-only `hash::chain_hash` use (optional `fixtures` feature) -- not for
# ciphers or keys.
#
# `ambre-call` is the call worker: it seals and opens the chunks of a call
# under the sender keys the Sync worker hands it (`CALL-003`, `ARCH-004`).
[[bans.deny]]
name = "ambre-crypto"
wrappers = ["ambre-sync", "ambre-logic", "ambre-call"]

# CRDT engine. The Sync worker must compile no CRDT (`SYNC-011`), and the relay
# must not be able to interpret a document at all. `ambre-logic` is the Logic
# thread, which holds every document already: it reads the PeerIDs a delta
# carries before any engine imports it (`AUTHOR-012`).
[[bans.deny]]
name = "loro"
wrappers = [
    "ambre-crdt", "ambre-logic", "ambre-murmure", "ambre-prose", "ambre-toile", "ambre-trame",
]

# The typed handles over the CRDT engine. They link Loro, so the four crates
# that may hold a document alone depend on them, and the Logic thread, which
# links Loro already and keeps the relay's numbers of each delta in the
# ledger of this crate (`AUTHOR-016`).
[[bans.deny]]
name = "ambre-crdt"
wrappers = ["ambre-trame", "ambre-toile", "ambre-prose", "ambre-murmure", "ambre-logic"]

# The four applications. The Logic thread runs them and the launcher draws
# them; no other crate links one, and the relay least of all: a document
# model there is a reader of the document (`ZK-041`).
[[bans.deny]]
name = "ambre-trame"
wrappers = ["ambre-app", "ambre-logic"]

[[bans.deny]]
name = "ambre-toile"
wrappers = ["ambre-app", "ambre-logic"]

[[bans.deny]]
name = "ambre-prose"
wrappers = ["ambre-app", "ambre-logic"]

[[bans.deny]]
name = "ambre-murmure"
wrappers = ["ambre-app", "ambre-logic"]

# The CSV reader and writer. A conversion runs on the user's machine, in the
# tables module the Logic thread loads (`TRAME-IO-001`, `ARCH-078`). The
# relay and the Sync worker compile no file reader.
[[bans.deny]]
name = "csv"
wrappers = ["ambre-convert"]

# The zip archive of the office formats, in the package layer the three
# codecs share, and the XML reader, in that layer and in each codec for its
# own parts. The Office module links them all, and the two instances none
# (`TRAME-IO-001`, `ARCH-078`).
[[bans.deny]]
name = "zip"
wrappers = ["ambre-opc"]

# The time-zone rules a Word date is read and written under, with the IANA
# database bundled: behind the Word mapping, in the Office module alone.
[[bans.deny]]
name = "jiff"
wrappers = ["ambre-prose-form"]

[[bans.deny]]
name = "quick-xml"
wrappers = ["ambre-docx", "ambre-odt", "ambre-opc", "ambre-pptx", "ambre-xlsx"]

# The OpenDocument text codec: in the Office module alone. Prose builds what
# the module answers, and the Main instance links no codec (`ARCH-078`).
[[bans.deny]]
name = "ambre-odt"
wrappers = ["ambre-convert"]

# The PDF writer: in the PDF module alone (`ARCH-078`).
[[bans.deny]]
name = "ambre-pdf"
wrappers = ["ambre-convert"]

# The Markdown parser and the HTML tree builder: in the markup module alone.
# Prose maps the trees the module answers (`ARCH-078`).
[[bans.deny]]
name = "pulldown-cmark"
wrappers = ["ambre-convert"]

[[bans.deny]]
name = "html5ever"
wrappers = ["ambre-convert"]

# The SVG reader and the XML parser of its text pass: in the images module
# alone. Toile maps the drawing the module answers (`ARCH-078`).
[[bans.deny]]
name = "usvg"
wrappers = ["ambre-convert"]

[[bans.deny]]
name = "roxmltree"
wrappers = ["ambre-convert", "usvg"]

# A channel crate that locks. flume's queue sits behind a `std::sync::Mutex`,
# and on the page's main thread a contended one ends in `Atomics.wait`, which
# the browser refuses (`ARCH-020`). Every client channel is
# `ambre_bus::conduit`, the Sync worker's included. `goose`, the relay's
# load-test tool, never reaches a browser.
[[bans.deny]]
name = "flume"
wrappers = ["goose"]

# The GPU binding. Its `unsafe` stays behind the rendering layer
# (`CANVAS-057`), and the Sync worker compiles none of it (`SYNC-096`). The
# launcher names it to own the device it hands the canvas.
[[bans.deny]]
name = "wgpu"
wrappers = ["ambre-canvas", "ambre-app"]

# The glyph rasterizer, the other `unsafe` render crate (`CANVAS-057`). An
# application draws text through the canvas, never through swash. The text
# stack no longer links it, so the canvas is its one parent.
[[bans.deny]]
name = "swash"
wrappers = ["ambre-canvas"]

# The protocol between the threads. The renderer knows no thread protocol
# (`ARCH-071`): a view converts what it reads off the bus into a type of the
# canvas. Every crate that speaks the protocol is named here, so a new direct
# dependant, the renderer first, is a reviewed edit of this file. No codec
# names it: each mirrors the interop report, so the converter modules stay
# leaves (`ambre-spec-interop.md`). The belt names it as a test dependency alone: a volume test
# encodes the roster ask of the Logic thread to tell it from a post a volume would make.
[[bans.deny]]
name = "ambre-bus"
wrappers = [
    "ambre-app", "ambre-belt", "ambre-logic", "ambre-murmure", "ambre-prose", "ambre-sync",
    "ambre-toile", "ambre-trame",
]

# One copy of the font readers in Main. krilla 0.8.2 and subsetter 0.2.6 pin
# skrifa 0.42 and read-fonts 0.39, so parley stays on 0.10, the last release
# that links the same pair. A newer pair is a second copy of both readers in
# the download (`ambre-spec-budgets.md section 5`): lift these two bans in the
# commit that moves krilla, subsetter and parley together.
[[bans.deny]]
crate = "skrifa:>=0.43"

[[bans.deny]]
crate = "read-fonts:>=0.40"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
