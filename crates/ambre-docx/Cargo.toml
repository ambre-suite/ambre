[package]
name = "ambre-docx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Word codec: a .docx package read into a model of the format, and the model written back, as pure functions"

[features]
# The codec itself: the package layer and the XML reader and writer. Off, the
# crate is the model alone, so a crate that maps the model links no ZIP and
# no XML code.
default = ["codec"]
codec = ["dep:ambre-opc", "dep:quick-xml"]

[dependencies]
# The day of a month that a Word date carries is a locale bound.
ambre-client-core = { path = "../ambre-client-core" }
ambre-core = { path = "../ambre-core" }
# The model crosses into and out of the converter module as postcard bytes.
serde      = { workspace = true }
thiserror  = { workspace = true }

# The package layer the three OOXML codecs share: the ZIP archive, the
# content types, the relationships and the bounds of a hostile package.
ambre-opc = { path = "../ambre-opc", optional = true }
quick-xml = { workspace = true, optional = true }

# The round trip over generated models. proptest pulls `wait-timeout`, which
# does not build on wasm32, so it is gated to the host target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }
# The codec bench holds the "Prose DOCX import / export" row of the budget
# register. Host-only, as the other benches of the workspace are.
criterion = { workspace = true }

[[bench]]
name = "codec"
harness = false

[lints]
workspace = true
