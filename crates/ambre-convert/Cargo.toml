[package]
name = "ambre-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The converter module: file formats in and out, a second wasm instance the Logic thread fetches on the first conversion"

[lib]
# cdylib: the converter module, a wasm artifact built apart from the Main
# instance by `scripts/converter_build.py` and fetched on the first
# conversion. rlib: the Logic thread links the request types on every target,
# and the engine itself on the host.
crate-type = ["cdylib", "rlib"]

[features]
# The converters themselves. On in the module build and on the host; off in the
# Main instance, which links the request types and the loader alone
# (`ARCH-078`).
engine = ["dep:ambre-pdf", "dep:csv"]
# The loader that instantiates the fetched module, on wasm. On in the Main
# instance alone: the module build leaves it off, so the module links no
# JavaScript binding it would export.
loader = ["dep:js-sys"]

[dependencies]
ambre-core = { path = "../ambre-core" }
# The recorded draw list a PDF request carries (`ambre_draw::list`).
ambre-draw = { path = "../ambre-draw" }
serde      = { workspace = true }
# A request and its answer cross into the module as postcard bytes.
postcard   = { workspace = true }
thiserror  = { workspace = true }

# The engine: the PDF writer and the CSV reader and writer. Pure Rust.
ambre-pdf  = { path = "../ambre-pdf", optional = true }
csv        = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The module's exports, and the loader the Logic thread instantiates it with.
wasm-bindgen = { workspace = true }
js-sys       = { workspace = true, optional = true }

# The loader's tests run in the browser (`just test-wasm`).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
