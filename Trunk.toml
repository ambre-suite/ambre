[build]
target = "crates/ambre-app/index.html"
# Each built file is named by a hash of its content, so a deployment may cache
# it for good and only the page is asked again. The page learns the Sync
# worker's hashed name from the post-build hook below.
filehash = true

# Builds the converter module and writes its digest, before the two instances
# build: the Sync worker carries the digest (`scripts/converter_build.py`).
[[hooks]]
stage = "pre_build"
command = "python3"
command_arguments = ["scripts/converter_build.py"]

# Writes the Sync worker's address into the page, the converter module named
# by its digest and, in a release, a brotli copy beside each compressible file
# (`scripts/trunk_post_build.py`).
[[hooks]]
stage = "post_build"
command = "python3"
command_arguments = ["scripts/trunk_post_build.py"]

# By default Trunk only watches the parent folder of `build.target`
# (crates/ambre-app/), so edits to any other workspace crate (ambre-trame,
# ambre-bus, ambre-logic, ...) never trigger a rebuild. Watch the whole `crates`
# tree instead, and ignore target/dist to avoid rebuild loops on build outputs.
# Both `watch` and `ignore` are resolved relative to the workspace root (where
# Trunk.toml lives).
[watch]
watch = ["crates"]
ignore = ["target", "dist"]

[serve]
port = 8080
open = true

# NOTE: proxies MUST be top-level `[[proxy]]`, not `[[serve.proxy]]`. Trunk
# silently ignores the nested form, so every /api and /ws request falls through
# to the static server (404 for GET, 405 for POST) instead of reaching the
# backend on :3000.
# The WebSocket endpoint is `/api/ws` (route `/ws` nested under `/api`). Its
# proxy MUST set `ws = true` AND be declared before the catch-all `/api/` proxy,
# otherwise the upgrade request matches the plain-HTTP `/api/` proxy, which
# cannot switch protocols (the WS closes with code 1006). More specific first.
[[proxy]]
rewrite = "/api/ws"
backend = "ws://127.0.0.1:3000/api/ws"
ws = true

# The call socket, `/api/calls/{call}/socket`, needs a WebSocket proxy of its
# own for the same reason. A Trunk WebSocket proxy refuses a plain request, so
# the roster, `GET /api/calls/{call}/roster`, fails behind `trunk serve`.
[[proxy]]
rewrite = "/api/calls/"
backend = "ws://127.0.0.1:3000/api/calls/"
ws = true

[[proxy]]
rewrite = "/api/"
backend = "http://127.0.0.1:3000/api/"

# The object store under the origin of the page, for the dev container stack,
# where Garage answers at `garage:3900` (`.devcontainer/README.md`). A phone
# then reaches a presigned link over HTTPS. The relay signs each link for
# `S3_ENDPOINT` and hands it out under `/s3/` (`S3_PUBLIC_ENDPOINT`, `SRV-265`).
# A signature covers the host header, and Trunk replaces it with the host of the
# backend without its port, so the proxy sets it back to the signed host. Outside
# that stack, the relay hands out links to `S3_ENDPOINT` and nothing reaches
# this proxy.
[[proxy]]
rewrite = "/s3/"
backend = "http://garage:3900/"
request_headers = { host = "garage:3900" }
no_system_proxy = true

# Cross-Origin Isolation: required to enable SharedArrayBuffer (and therefore
# WebAssembly.Memory shared = true), the bedrock for the multi-threaded WASM
# model described in specs/1-Foundations/ambre-spec-architecture.md.
#
# COOP=same-origin isolates this top-level browsing context from popups/openers.
# COEP=credentialless strips credentials from cross-origin sub-resource fetches
# (less invasive than `require-corp`, which would force every third-party asset
# to opt in via CORP headers).
#
# The content policy refuses any page that frames this one, which the meta of
# the page cannot do (`SRV-281`). Trunk sets one set of headers on every
# answer, so the worker policy of the build's `_headers` file holds behind a
# deployment's server alone.
[serve.headers]
"Cross-Origin-Opener-Policy" = "same-origin"
"Cross-Origin-Embedder-Policy" = "credentialless"
"Content-Security-Policy" = "frame-ancestors 'none'"

[profile.dev]
wasm_opt = false # disable wasm optimization for faster builds during development

[profile.release]
# wasm_opt disabled: it makes the download larger. See the rationale in
# crates/ambre-app/index.html.
wasm_opt = false