[package]
name = "ambre-logic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Logic thread — typed command dispatch, per-document state registry, viewport computation. Runs as a dedicated thread sharing the WASM heap."

[dependencies]
ambre-bus   = { path = "../ambre-bus" }
ambre-trame = { path = "../ambre-trame" }

flume         = { workspace = true, features = ["async"] }
tracing       = { workspace = true }
futures-util  = { workspace = true }

wasm-bindgen        = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys              = { workspace = true }
web-sys             = { workspace = true, features = [
    "IdbDatabase",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbKeyRange",
    "Storage",
    "Window",
] }
