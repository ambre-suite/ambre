[package]
name = "ambre-toile"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Whiteboard & presentations application for Ambre — infinite canvas, embedded documents"

[features]
# PDF export (`toile-pdf-export`). Off by default; the Logic thread turns it on.
pdf = ["dep:ambre-convert"]
# Document-fixture machinery (`ambre-spec-fixtures.md`, `FIXTURE-007`). Non-default and
# host-only. Explicitly forwards `ambre-core/fixtures`: a Cargo feature never
# enables its dependency's feature implicitly, and the gated code names
# `ambre_core::FixtureShape`.
fixtures = ["ambre-core/fixtures"]

[dependencies]
ambre-core = { path = "../ambre-core" }
ambre-bus = { path = "../ambre-bus" }
ambre-draw = { path = "../ambre-draw" }
# Command registry (`CommandId`): the context-menu command surface
# (`toile-menus`) is pure and host-tested in `ui::menu`, so this is a host dependency, not
# wasm-only like the Leptos chrome that renders it.
ambre-commands = { path = "../ambre-commands" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# PDF export (`toile-pdf-export`), gated behind the `pdf` feature. The deck is
# recorded as a draw list and the converter module writes it, so this crate
# links the request types and the loader, never the writer (`ARCH-078`).
ambre-convert = { path = "../ambre-convert", optional = true }

# CRDT
loro = { workspace = true }
# The map handles typed by the schema keys.
ambre-crdt = { path = "../ambre-crdt" }

# Spatial indexing
rstar = { workspace = true }

# 2D geometry: connector routing, stroke smoothing, viewport / bounds math.
# Re-exported by ambre-draw, but named here directly for the Logic-thread engine.
kurbo = { workspace = true }

# 2D polygon boolean ops (union / subtract / intersect / exclude,
# `toile-vector-paths`). kurbo has no path-vs-path booleans, so shapes are flattened to polygon
# contours and combined here. Pure Rust, WASM-friendly.
i_overlay = { workspace = true }

# Compact serialization of the per-element ElementStyle LWW register (§2.E) and
# the clipboard payload -- consistent with the inter-thread IPC protocol.
postcard = { workspace = true }

# Interop Phase 0 (`toile-import-export`): pure-Rust SVG parse and raster codecs on
# the Logic-thread import path. No plaintext ever leaves the client (`ZK-001`).
# usvg handles vector shapes/paths/images; `<text>` is read via roxmltree and
# kept editable (Toile owns text via Parley, not usvg glyph flattening).
usvg = { workspace = true }
roxmltree = { workspace = true }
image = { workspace = true }
# An exported picture carries its pixels as a `data:` URI, so a reader outside
# Ambre resolves it (`TOILE-IO-087`). No key and no ciphertext go through it.
base64 = { workspace = true }

# UI side (UI Thread): the DrawSurface renderer, GPU runtime, frame channels.
# The heavy render crates (wgpu/lyon/parley/swash) are linked once in
# ambre-canvas and shared; the view only paints through WgpuSurface
# (`toile-board-rendering`).
ambre-canvas = { path = "../ambre-canvas" }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
# Shared SVG icon data (pure static strings, no Leptos): used host-side to build
# the rotate-handle cursor from `LuRotateCw` (§5quinquies.A) and wasm-side by the
# context-menu glyphs via `leptos_icons`.
icondata = { workspace = true }

# Toile-specific chrome (the tool palette / panels) is wasm-only Leptos, like
# ambre-trame's chrome; scoped to wasm32 so host logic/render tests never build it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ambre-chrome = { path = "../ambre-chrome" }
leptos = { workspace = true }
# Context-menu entry icons (`toile-menus`): every entry glyph comes from
# `icondata`, rendered through `leptos-icons` inside `ambre-chrome::ContextMenu`.
leptos_icons = { workspace = true }
# The author's wall clock, which rides a comment command because the Logic
# thread holds none (`toile-comments` section 5). `std::time` is unavailable on
# wasm32-unknown-unknown.
js-sys = { workspace = true }
# A file picked or dropped for the board is read off the main thread
# (`File::array_buffer`) before the view imports it (`toile-import-export`).
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
# Headless render tests: RecordingSurface mock DrawSurface + FixedClock.
ambre-draw = { path = "../ambre-draw", features = ["testing"] }
# `Seq::nth` for a test that names a count. Test builds alone, held by
# `ambre-core/tests/testing_feature.rs` (`ARCH-055`).
ambre-core = { path = "../ambre-core", features = ["testing"] }

# DOM tests for the Toile chrome (Epic `ET`, `ambre-spec-testing.md`
# "wasm" tier): leptos CSR + real `document`, run via
# `wasm-bindgen-test-runner` in headless Chrome (`just test-wasm`). The tests
# also name `web-sys` and `wasm-bindgen`, which `[dependencies]` declares.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Index-equivalence and 2-peer CRDT convergence property tests (§10, DoD).
# proptest pulls `wait-timeout`, which does not build on wasm32; the engine is
# host-testable, so gate it to the host target like ambre-trame does.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }
# The PDF tests write the recorded deck through the engine linked in place, as
# the Logic thread's host build does (`ambre_convert::Converter`).
ambre-convert = { path = "../ambre-convert", features = ["engine"] }
# The import bench holds the "Toile SVG import, 5 000 nodes" row of the budget
# registry. Host-only, as the other benches of the workspace are.
criterion = { workspace = true }

[[bench]]
name = "import"
harness = false

# Holds the "Toile index update" and "Toile remote change" rows.
[[bench]]
name = "board_cost"
harness = false

# Holds the "Toile body commit" row by a count of instructions under callgrind,
# through `scripts/instructions.py`.
[[bench]]
name = "instructions"
harness = false

[lints]
workspace = true
