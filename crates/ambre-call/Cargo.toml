[package]
name = "ambre-call"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Call worker: the third wasm instance, which seals and opens the audio chunks of one call under the sender keys the Sync worker hands it (ambre-spec-call-media.md)."

[lib]
# cdylib: the call worker wasm artefact, built by Trunk through the
# `#[wasm_bindgen(start)]` entry in `worker.rs`. rlib: so the host tier links
# the state the worker keeps.
crate-type = ["cdylib", "rlib"]

[dependencies]
ambre-core   = { path = "../ambre-core" }
# The chunk seal and open, and the handoff of a sender key (`CALL-003`).
ambre-crypto = { path = "../ambre-crypto" }

# The worker reads its streams and its port in the browser alone.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    # The worker scope, the port from the Sync worker and the messages on both.
    "DedicatedWorkerGlobalScope", "MessageEvent", "MessagePort", "Event",
    # The streams of the encoded frames an `RTCRtpScriptTransform` hands the worker.
    "ReadableStream", "ReadableStreamDefaultReader", "WritableStream",
    "WritableStreamDefaultWriter",
] }
console_error_panic_hook = { workspace = true }

[lints]
workspace = true
