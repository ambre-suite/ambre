# The local cluster of `just chart-test` (`SRV-309`): one node, whose
# port 443 the runner reaches at `https://localhost`. The browser reaches the
# media of the SFU at the address of the node itself (`CALL-141`).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
