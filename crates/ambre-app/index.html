<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ambre</title>

    <!--
        Trunk processes this file at build time.
        - <link data-trunk rel="rust">     builds crates/ambre-app (UI Thread, src/lib.rs)
        - <link data-trunk rel="copy-file"> copies the worker bootstrap JS files
        - <link data-trunk rel="copy-dir">  copies pre-built worker WASM packages into dist/

        Worker WASM binaries (ambre-logic-worker, ambre-sync-worker) are built
        separately with wasm-pack before running Trunk. Run `make workers` first,
        then `trunk serve` or `trunk build`.
    -->

    <!-- UI Thread WASM — Trunk builds src/lib.rs (#[wasm_bindgen(start)]) -->
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <!-- Worker bootstrap JS files (served at root, referenced by Worker::new_with_options) -->
    <link data-trunk rel="copy-file" href="logic_worker.js" />
    <link data-trunk rel="copy-file" href="sync_worker.js" />

    <!-- Font assets served at /fonts/ — loaded at runtime via fetch() (no include_bytes!) -->
    <link data-trunk rel="copy-dir" href="fonts" />

    <!-- Inter font — embedded in WASM bundle for production, loaded via CSS for shell fallback -->
    <!-- <link data-trunk rel="copy-file" href="assets/inter.woff2" /> -->

    <style>
        /* Reset — the entire viewport belongs to the wgpu canvas */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            /* Prevent pull-to-refresh and overscroll on mobile */
            overscroll-behavior: none;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Prevent canvas selection highlight on mobile */
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        /* Loading screen — visible until WASM takes over the canvas */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #333;
            border-top-color: #7c6ef0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Fallback message if WebGPU is completely unavailable */
        #no-webgpu {
            display: none;
            position: fixed;
            inset: 0;
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 2rem;
            text-align: center;
            z-index: 20;
        }

        #no-webgpu h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        #no-webgpu p {
            max-width: 480px;
            margin: 0 auto 1rem;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <!-- Loading screen (removed by WASM after GPU init) -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Chargement...</p>
    </div>

    <!-- wgpu render target (WebGL2 by default, WebGPU opt-in via ?webgpu) -->
    <canvas id="ambre-canvas" tabindex="0"></canvas>

    <!--
        Fallback message for browsers without WebGL2 (extremely rare — IE11 and below).
        wgpu uses WebGL2 by default; WebGPU is opt-in via ?webgpu in the URL.
        This div is never shown in practice on any modern browser.
    -->
    <div id="no-webgpu">
        <h1>Navigateur non compatible</h1>
        <p>
            Ambre utilise WebGL2 pour le rendu. Votre navigateur ne semble pas le supporter.
        </p>
        <p>
            Navigateurs compatibles : Chrome 56+, Firefox 51+, Safari 15+, Edge 79+.
        </p>
    </div>

    <script type="module">
        // ------------------------------------------------------------------
        // Minimal JS bootstrap — everything else is in Rust/WASM.
        //
        // This script:
        // 1. Detects GPU support (informational — WebGL2 is the default backend)
        // 2. Hides the loading screen once WASM signals readiness
        // 3. Handles canvas resize via ResizeObserver
        //
        // The WASM entry point (lib.rs / wasm_bindgen(start)) handles:
        // - Spawning Logic Worker + Sync Worker
        // - Creating the MessageChannel for Logic <-> Sync
        // - Initializing wgpu (WebGL2 backend) + QuadRenderer + GlyphAtlas
        // - Starting the rAF render loop (after GPU init)
        // ------------------------------------------------------------------

        // Expose a global callback for WASM to signal "ready" and hide the loading screen.
        window.ambreReady = function () {
            const loading = document.getElementById("loading");
            if (loading) {
                loading.classList.add("hidden");
                setTimeout(() => loading.remove(), 300);
            }
        };

        // Canvas resize — set the backing store size (physical pixels).
        // WASM handles the GPU surface reconfigure via window.onresize.
        // ResizeObserver here ensures the canvas dimensions are correct before WASM fires.
        const canvas = document.getElementById("ambre-canvas");
        const observer = new ResizeObserver(entries => {
            for (const entry of entries) {
                const dpr = window.devicePixelRatio || 1;
                const width = Math.round(entry.contentRect.width * dpr);
                const height = Math.round(entry.contentRect.height * dpr);
                canvas.width = width;
                canvas.height = height;
            }
        });
        observer.observe(canvas);

        // Initial size
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(canvas.clientWidth * dpr);
        canvas.height = Math.round(canvas.clientHeight * dpr);
    </script>
</body>

</html>
